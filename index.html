<style>
:root{--bg:#F3F4F7;--card:#FFFFFF;--soft:#F0F1F4;--line:#E6E7EB;--tx:#16181D;--tx2:#5F6470;--tx3:#9196A1;--acc:#0B8A6F;--acc2:#0B6E5B;--accbg:#E3F4EF;--red:#D6404A;--redbg:#FCEBEC;--grn:#11935A;--grnbg:#E5F5EC;--amb:#B26B00;--ambbg:#FFF3DE;--p1:#6D5FD9;--p1bg:#EEECFC;--p2:#D2487A;--p2bg:#FCEAF1;--sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#0E1013;--card:#181B20;--soft:#20242B;--line:#2A2F37;--tx:#F1F2F4;--tx2:#A4A9B3;--tx3:#6F7581;--acc:#2BC39C;--acc2:#1FA585;--accbg:#123A31;--red:#F07178;--redbg:#3A1C1F;--grn:#46D08F;--grnbg:#14352A;--amb:#F2B54C;--ambbg:#3A2C12;--p1:#A79DF5;--p1bg:#2A2650;--p2:#F28BB0;--p2bg:#45202F;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
h2{font-size:16px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
.muted{color:var(--tx2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--tx3)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{background:linear-gradient(135deg,#0B8A6F 0%,#0B5F50 100%);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 8px 24px rgba(11,110,91,.25)}
.hero .lbl{opacity:.85;font-size:13px}.hero .big{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:2px 0}

.hero.hneg{background:linear-gradient(135deg,#C2414B 0%,#8E2A33 100%);box-shadow:0 8px 24px rgba(194,65,75,.25)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18)}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.stat .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:10px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.iconbtn{border:0;background:var(--card);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);flex:none}
.iconbtn svg{width:20px;height:20px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);color:#fff}.btn.danger{background:var(--redbg);color:var(--red)}.btn.full{width:100%}.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:active,.iconbtn:active{transform:scale(.97)}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.bk{font-weight:800;font-size:13px;letter-spacing:-.03em;color:#fff}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.it .mid{flex:1;min-width:0}.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .val{font-weight:700;text-align:right;white-space:nowrap}
.dayh{font-size:12px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 2px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--soft);color:var(--tx2)}
.tag.p1{background:var(--p1bg);color:var(--p1)}.tag.p2{background:var(--p2bg);color:var(--p2)}.tag.amb{background:var(--ambbg);color:var(--amb)}.tag.acc{background:var(--accbg);color:var(--acc)}.tag.red{background:var(--redbg);color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--tx3);padding:6px 0;cursor:pointer}
.nav button svg{width:23px;height:23px}.nav button.on{color:var(--acc)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 80px);width:56px;height:56px;border-radius:18px;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(11,138,111,.35);cursor:pointer;z-index:15}
.fab svg{width:26px;height:26px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none;appearance:none;-webkit-appearance:none}
select.f{background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input.f:focus,select.f:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
label.l{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin:12px 0 5px}
.sheetbg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.drop{border:2px dashed var(--line);border-radius:20px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--card)}
.drop svg{width:34px;height:34px;color:var(--acc)}
.chk{width:22px;height:22px;accent-color:var(--acc);flex:none}
.prow{padding:10px 0;border-bottom:1px solid var(--line)}.prow:last-child{border:0}
.prow.dup{opacity:.45}
.prow select.f{padding:7px 28px 7px 10px;font-size:13px;border-radius:10px;margin-top:6px}
.banner{border-radius:14px;padding:11px 13px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner.amb{background:var(--ambbg);color:var(--amb)}.banner.acc{background:var(--accbg);color:var(--acc2)}.banner.red{background:var(--redbg);color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);background:#16181D;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;animation:fade .2s}
.donutwrap{display:flex;gap:16px;align-items:center}
.legend .lg{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.dot{width:10px;height:10px;border-radius:4px;flex:none}
.empty{text-align:center;padding:26px 10px;color:var(--tx2)}
.empty .e{font-size:38px;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--tx2)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.mbar{display:flex;align-items:flex-end;gap:10px;height:110px;padding-top:6px}
.mbar .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.mbar .bb{display:flex;gap:3px;align-items:flex-end;height:86px}
.mbar .bb i{width:9px;border-radius:5px 5px 2px 2px;display:block}
.mbar .c.on .ml{color:var(--tx);font-weight:700}
.ml{font-size:11px;color:var(--tx3);font-weight:600}
hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}
.hide{display:none!important}
</style>

<script>
// ===== Leitores de arquivos (OFX, CSV, PDF) e classificação =====
const P = {};

P.norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();

P.money = function (raw) {
  if (raw == null) return NaN;
  let s = String(raw).trim();
  let neg = /^-|^\(|-\s*R\$|R\$\s*-|\s-$|\bD$/i.test(s);
  s = s.replace(/[^\d.,]/g, '');
  if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) {
    if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  } else if (lc > -1) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (ld > -1) {
    const parts = s.split('.');
    if (parts.length > 2 || (parts[1] && parts[1].length === 3 && parts.length === 2 && /^\d{1,3}$/.test(parts[0]) && false)) s = s.replace(/\./g, '');
  }
  const v = parseFloat(s);
  return isNaN(v) ? NaN : (neg ? -v : v);
};

const MESES = { JAN: 1, FEV: 2, FEB: 2, MAR: 3, ABR: 4, APR: 4, MAI: 5, MAY: 5, JUN: 6, JUL: 7, AGO: 8, AUG: 8, SET: 9, SEP: 9, OUT: 10, OCT: 10, NOV: 11, DEZ: 12, DEC: 12 };
P.pad = n => String(n).padStart(2, '0');
P.iso = (y, m, d) => `${y}-${P.pad(m)}-${P.pad(d)}`;
P.date = function (raw, refYear) {
  const s = String(raw || '').trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return P.iso(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return P.iso(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) {
    let y = +m[3]; if (y < 100) y += 2000; return P.iso(y, +m[2], +m[1]);
  }
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})$/)) && refYear) return P.iso(refYear, +m[2], +m[1]);
  if ((m = P.norm(s).match(/^(\d{1,2})\s*(?:DE\s*)?([A-Z]{3})/)) && MESES[m[2]] && refYear) return P.iso(refYear, MESES[m[2]], +m[1]);
  return null;
};
P.addDays = function (iso, n) {
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n);
  return P.iso(d.getFullYear(), d.getMonth() + 1, d.getDate());
};

// --- descrição limpa (nome do estabelecimento / pessoa)
P.clean = function (desc) {
  let s = String(desc || '').replace(/\s+/g, ' ').trim();
  let meio = '';
  const pref = [
    [/^Transfer[êe]ncia enviada pelo Pix - /i, 'Pix enviado'],
    [/^Transfer[êe]ncia recebida pelo Pix - /i, 'Pix recebido'],
    [/^Transfer[êe]ncia recebida - /i, 'Pix recebido'],
    [/^Transfer[êe]ncia enviada - /i, 'Pix enviado'],
    [/^Estorno - Transfer[êe]ncia enviada pelo Pix - /i, 'Estorno'],
    [/^Estorno - /i, 'Estorno'],
    [/^Pix no Cr[ée]dito - /i, 'Pix no crédito'],
    [/^Compra no d[ée]bito - /i, 'Débito'],
    [/^Compra no cr[ée]dito - /i, 'Crédito'],
    [/^PAGAMENTO PIX - /i, 'Pix enviado'],
    [/^RECEBIMENTO PIX - /i, 'Pix recebido'],
    [/^CARTAO DEBITO - /i, 'Débito'],
    [/^Pix enviado /i, 'Pix enviado'],
    [/^Pix recebido /i, 'Pix recebido'],
    [/^Pagamento de boleto efetuado - /i, 'Boleto'],
    [/^PIX ENVIADO\s*-?\s*/i, 'Pix enviado'],
    [/^PIX RECEBIDO\s*-?\s*/i, 'Pix recebido'],
  ];
  for (const [re, t] of pref) if (re.test(s)) { s = s.replace(re, ''); meio = t; break; }
  s = s.replace(/^\d{11,14}\s+/, '');            // CPF/CNPJ no início (Sicredi)
  s = s.replace(/^\d{2}\.\d{3}\.\d{3}\s+/, '');   // CNPJ de MEI no nome
  s = s.split(/ - (?:•|\*|\d{2}\.\d{3}\.\d{3}\/|\d{3}\.\d{3}\.\d{3}-)/)[0];
  s = s.replace(/ - BR$/i, '').replace(/\s*-\s*$/, '').trim();
  // parcela no fim do nome: "MIDWAY - 3/4", "LOJA 03/10", "Parcela 2/5"
  let parc = '';
  const mp = s.match(/\s*(?:-\s*)?(?:PARCELA\s*)?(\d{1,2})\s*\/\s*(\d{1,2})$/i);
  if (mp && +mp[1] >= 1 && +mp[1] <= +mp[2] && +mp[2] > 1 && s.length > mp[0].length) { parc = +mp[1] + '/' + +mp[2]; s = s.slice(0, s.length - mp[0].length).replace(/\s*-\s*$/, '').trim(); }
  return { nome: s || String(desc || '').trim(), meio, parc };
};

// ===================== OFX =====================
P.parseOFX = function (text) {
  const tag = (blk, t) => { const m = blk.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  const org = tag(text, 'ORG'), bankid = tag(text, 'BANKID');
  const isCard = /<CREDITCARDMSGSRSV1>|<CCACCTFROM>/i.test(text);
  const acct = tag(text, 'ACCTID');
  const rows = [];
  const re = /<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi;
  let m;
  while ((m = re.exec(text))) {
    const b = m[1];
    const valor = parseFloat(tag(b, 'TRNAMT').replace(',', '.'));
    const memo = tag(b, 'MEMO') || tag(b, 'NAME');
    const name = tag(b, 'NAME');
    rows.push({ data: P.date(tag(b, 'DTPOSTED')), valor, desc: memo && name && !memo.includes(name) ? name + ' - ' + memo : memo, fitid: tag(b, 'FITID') });
  }
  const bal = tag(text, 'BALAMT'), balData = P.date(tag(text, 'DTASOF'));
  let banco = org || bankid;
  if (/NU PAGAMENTOS|^0?260$/i.test(banco) || bankid === '0260') banco = 'Nubank';
  else if (/SICREDI|^748$/i.test(banco) || bankid === '748' || bankid === '0748') banco = 'Sicredi';
  else if (/INTER|^077$/i.test(banco) || bankid === '077' || bankid === '0077') banco = 'Inter';
  else if (/MERCADO ?PAGO|^323$/i.test(banco) || bankid === '0323') banco = 'Mercado Pago';
  return { formato: 'OFX', banco, tipo: isCard ? 'cartao' : 'conta', acctKey: (banco || '') + ':' + acct, saldo: bal ? parseFloat(bal.replace(',', '.')) : null, saldoData: balData, rows };
};

// ===================== CSV =====================
P.splitCSV = function (text) {
  text = text.replace(/^﻿/, '');
  const lines = text.split(/\r?\n/);
  const sample = lines.slice(0, 15).join('\n');
  const sc = (sample.match(/;/g) || []).length, cc = (sample.match(/,/g) || []).length, tc = (sample.match(/\t/g) || []).length;
  const d = tc > sc && tc > cc ? '\t' : (sc >= cc * 0.5 && sc > 0 ? ';' : ',');
  const out = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const cells = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true; else if (ch === d) { cells.push(cur.trim()); cur = ''; } else cur += ch;
    }
    cells.push(cur.trim()); out.push(cells);
  }
  return out;
};

P.csvGuess = function (rows) {
  // procura a linha de cabeçalho e as colunas de data, descrição e valor
  for (let h = 0; h < Math.min(rows.length, 25); h++) {
    const H = rows[h].map(P.norm);
    const fi = re => H.findIndex(c => re.test(c));
    let data = fi(/^(DATA|DATE|DT)( |$|_)|^DATA LANCAMENTO|^RELEASE_DATE|^DATA DA COMPRA|^DATA DE LANCAMENTO/);
    let valor = fi(/^(VALOR|AMOUNT|TRANSACTION_NET_AMOUNT|VALOR \(R\$\)|VALOR EM R\$|VALOR R\$)$/);
    if (valor < 0) valor = fi(/VALOR|AMOUNT/);
    let desc = fi(/^(DESCRICAO|DESCRIPTION|TITLE|HISTORICO|TRANSACTION_TYPE|ESTABELECIMENTO|LANCAMENTO)$/);
    if (desc < 0) desc = fi(/DESCRI|HISTOR|TITLE|ESTABELEC/);
    const id = fi(/^(IDENTIFICADOR|ID|REFERENCE_ID|ID DA OPERACAO|CODIGO)$/);
    const hist = fi(/^HISTORICO$/);
    let saldo = fi(/^(SALDO|SALDO \(R\$\)|SALDO EM R\$|SALDO R\$|SALDO DO DIA|BALANCE|PARTIAL_BALANCE)$/);
    if (saldo < 0) saldo = fi(/SALDO|BALANCE/);
    if (saldo === valor) saldo = -1;
    if (data > -1 && valor > -1 && desc > -1) return { header: h, data, valor, desc, id, saldo, hist: hist !== desc ? hist : -1, cols: rows[h] };
  }
  return null;
};

P.parseCSV = function (text, map) {
  const rows = P.splitCSV(text);
  const g = map || P.csvGuess(rows);
  const H = g ? rows[g.header].map(P.norm).join('|') : '';
  let banco = '', tipo = 'conta', inv = false;
  if (/IDENTIFICADOR/.test(H) && /CODTRANSACAO/.test(H)) banco = 'Sicredi';
  else if (/^DATA\|VALOR\|IDENTIFICADOR\|DESCRICAO/.test(H)) banco = 'Nubank';
  else if (/^DATE\|TITLE\|AMOUNT/.test(H)) { banco = 'Nubank'; tipo = 'cartao'; inv = true; }
  else if (/RELEASE_DATE/.test(H)) banco = 'Mercado Pago';
  else if (/DATA LANCAMENTO/.test(H) && /HISTORICO/.test(H)) banco = 'Inter';
  if (!g) return { formato: 'CSV', banco, tipo, rows: [], needMap: true, preview: rows.slice(0, 8) };
  const out = [];
  const seen = {};
  const saldos = []; // [data, saldo, ordem]
  for (let i = g.header + 1; i < rows.length; i++) {
    const r = rows[i];
    const data = P.date(r[g.data]);
    let valor = P.money(r[g.valor]);
    if (!data || isNaN(valor)) continue;
    if (g.saldo > -1 && r[g.saldo] !== undefined && r[g.saldo] !== '') { const sv = P.money(r[g.saldo]); if (!isNaN(sv)) saldos.push([data, sv, i]); }
    if (inv || (map && map.inverter)) valor = -valor;
    let desc = r[g.desc] || '';
    if (g.hist > -1 && r[g.hist] && !desc.includes(r[g.hist])) desc = r[g.hist] + ' - ' + desc;
    let fitid = g.id > -1 ? r[g.id] : '';
    if (!fitid) { const k = data + '|' + valor + '|' + P.norm(desc); seen[k] = (seen[k] || 0) + 1; fitid = 'h:' + k + '|' + seen[k]; }
    out.push({ data, valor, desc, fitid });
  }
  let saldo = null, saldoData = null;
  if (saldos.length) {
    // o saldo mais recente: se o arquivo está do mais novo para o mais velho, é o primeiro do último dia
    const desc = saldos.length > 1 && saldos[0][0] > saldos[saldos.length - 1][0];
    const ult = saldos.reduce((m, s) => s[0] > m ? s[0] : m, '');
    const doDia = saldos.filter(s => s[0] === ult);
    const s = desc ? doDia[0] : doDia[doDia.length - 1]; saldo = s[1]; saldoData = s[0];
  } else {
    // Mercado Pago: linha FINAL_BALANCE no topo
    for (let i = 0; i < Math.min(rows.length - 1, 6); i++) { const k = rows[i].map(P.norm).indexOf('FINAL_BALANCE'); if (k > -1) { const sv = P.money(rows[i + 1][k]); if (!isNaN(sv)) { saldo = sv; saldoData = out.reduce((m, r) => r.data > m ? r.data : m, '') || null; } break; } }
  }
  return { formato: 'CSV', banco, tipo, rows: out, map: g, header: rows[g.header], saldo, saldoData };
};

// ===================== PDF =====================
// lines: [{y, text}] já montadas com espaços entre colunas (3+ espaços = coluna)
P.parsePDF = function (lines, refYear) {
  const all = lines.map(l => l.text);
  const T = P.norm(all.join('\n'));
  const MONEY = /-?\s*R?\$?\s*-?\d{1,3}(?:\.\d{3})*,\d{2}/g;

  // --- BônusCred: compras com vencimento individual (30 dias após a compra)
  if (/BONUSCRED|BONUS ?CRED/.test(T) || (/DOCUMENTO/.test(T) && /VENCIMENTO/.test(T) && /A VENCER|VENCIDO|PAGO/.test(T))) {
    const rows = [];
    for (const t of all) {
      const m = t.match(/^\s*(\S+)\s{2,}(.+?)\s{2,}(\d{2}\/\d{2}\/\d{4})\s{2,}(.*?)\s{2,}(-?[\d.]+,\d{2})\s*$/);
      if (!m) continue;
      const venc = P.date(m[3]);
      rows.push({ data: P.addDays(venc, -30), venc, valor: -Math.abs(P.money(m[5])), desc: m[2].trim(), fitid: 'bc:' + m[1], obs: m[4].trim() });
    }
    return { formato: 'PDF', banco: 'BônusCred', tipo: 'loja', prazo: 30, rows };
  }

  // --- Mercado Pago: extrato de conta (descrição pode quebrar em 2 linhas)
  if (/MERCADO PAGO/.test(T) && /DETALHE DOS MOVIMENTOS/.test(T)) {
    const start = all.findIndex(t => /DETALHE DOS MOVIMENTOS/i.test(P.norm(t)));
    let end = all.findIndex((t, i) => i > start && /DATA DE GERACAO|VOCE TEM ALGUMA DUVIDA/.test(P.norm(t)));
    if (end < 0) end = all.length;
    const sec = lines.slice(start + 1, end).filter(l => !/^\s*DATA\s+DESCRI/.test(P.norm(l.text)));
    const anchors = [];
    sec.forEach((l, i) => { if (/^\s*\d{2}-\d{2}-\d{4}/.test(l.text)) anchors.push(i); });
    const rows = anchors.map(i => {
      const l = sec[i];
      const m = l.text.match(/^\s*(\d{2}-\d{2}-\d{4})\s*(.*?)\s{2,}(\d{6,})\s+(R\$\s*-?[\d.]+,\d{2})/) || l.text.match(/^\s*(\d{2}-\d{2}-\d{4})\s*(.*?)\s*(\d{6,})\s+(R\$\s*-?[\d.]+,\d{2})/);
      if (!m) return null;
      const after = l.text.slice(l.text.indexOf(m[4]) + m[4].length).match(/R\$\s*-?[\d.]+,\d{2}/);
      return { y: l.y, data: P.date(m[1]), desc: m[2].trim(), fitid: 'mp:' + m[3], valor: P.money(m[4]), _saldo: after ? P.money(after[0]) : null };
    }).filter(Boolean);
    sec.forEach((l, i) => {
      if (anchors.includes(i) || !l.text.trim()) return;
      let best = null, bd = 1e9;
      for (const r of rows) { const d = Math.abs(r.y - l.y); if (d < bd) { bd = d; best = r; } }
      if (best && bd < 30) (best.extra = best.extra || []).push({ y: l.y, t: l.text.trim() });
    });
    for (const r of rows) {
      const parts = [{ y: r.y, t: r.desc }].concat(r.extra || []).filter(p => p.t).sort((a, b) => a.y - b.y);
      r.desc = parts.map(p => p.t).join(' ').replace(/\s+/g, ' ').trim();
      delete r.extra; delete r.y;
    }
    let saldo = null, saldoData = null;
    const sf = all.map(P.norm).find(t => /SALDO FINAL/.test(t));
    const ultData = rows.reduce((m, r) => r.data > m ? r.data : m, '') || null;
    if (sf && sf.match(MONEY)) { saldo = P.money(sf.match(MONEY).pop()); saldoData = ultData; }
    else { const comSaldo = rows.filter(r => r._saldo != null && !isNaN(r._saldo)); if (comSaldo.length) { const u = comSaldo.reduce((m, r) => r.data >= m.data ? r : m); saldo = u._saldo; saldoData = u.data; } }
    rows.forEach(r => delete r._saldo);
    return { formato: 'PDF', banco: 'Mercado Pago', tipo: 'conta', rows, saldo, saldoData };
  }

  // --- Fatura de cartão com datas "05 OUT" (Nubank e outras)
  const venc = (T.match(/VENCIMENTO[^0-9]{0,40}(\d{2}[\/ ](?:\d{2}|[A-Z]{3})[\/ ]?\d{0,4})/) || [])[1];
  let vencISO = venc ? P.date(venc.replace(/ /g, '/'), refYear) : null;
  if (!vencISO && venc) { const mm = P.norm(venc).match(/(\d{2}) ([A-Z]{3}) ?(\d{4})?/); if (mm && MESES[mm[2]]) vencISO = P.iso(+(mm[3] || refYear), MESES[mm[2]], +mm[1]); }
  const yRef = vencISO ? +vencISO.slice(0, 4) : refYear;
  const mRef = vencISO ? +vencISO.slice(5, 7) : 12;
  const rows = [];
  const seen = {};
  let ultSaldo = null, primSaldo = null;
  for (const t of all) {
    const N = P.norm(t);
    let m, data = null, rest = '';
    if ((m = N.match(/^\s*(\d{2})\s+(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\b\s*(.*)$/))) {
      const mo = MESES[m[2]]; const y = mo > mRef ? yRef - 1 : yRef;
      data = P.iso(y, mo, +m[1]); rest = t.replace(/^\s*\d{2}\s+\S{3}\s*/, '');
    } else if ((m = t.match(/^\s*(\d{2}[\/\-]\d{2}(?:[\/\-]\d{2,4})?)\s+(.*)$/))) {
      data = P.date(m[1], yRef); rest = m[2];
      if (data && !/\d{4}$|\d{2}$/.test(m[1].slice(-4)) ) data = data;
      if (data && m[1].length <= 5) { const mo = +data.slice(5, 7); if (mo > mRef) data = P.iso(yRef - 1, mo, +data.slice(8, 10)); }
    }
    if (!data) continue;
    const vals = rest.match(MONEY);
    if (!vals) continue;
    const temSaldo = vals.length > 1 && /SALDO/.test(T);
    const vtxt = vals[temSaldo ? vals.length - 2 : vals.length - 1];
    if (temSaldo) ultSaldo = { data, v: P.money(vals[vals.length - 1]), ordem: rows.length };
    let valor = P.money(vtxt);
    let desc = rest.slice(0, rest.indexOf(vals[0])).replace(/•+\s*\d{4}/g, '').replace(/\s{2,}/g, ' ').trim();
    if (!desc || isNaN(valor)) continue;
    if (ultSaldo && ultSaldo.ordem === rows.length && !primSaldo) primSaldo = ultSaldo;
    const k = data + '|' + valor + '|' + P.norm(desc); seen[k] = (seen[k] || 0) + 1;
    rows.push({ data, valor, desc, fitid: 'p:' + k + '|' + seen[k], venc: vencISO || undefined });
  }
  let banco = /NU PAGAMENTOS|NUBANK/.test(T) ? 'Nubank' : /SHOPEE/.test(T) ? 'Shopee' : /RIACHUELO|MIDWAY/.test(T) ? 'Riachuelo' : /INTER/.test(T) ? 'Inter' : /SICREDI/.test(T) ? 'Sicredi' : /MERCADO PAGO/.test(T) ? 'Mercado Pago' : '';
  const fatura = /FATURA|CARTAO|LIMITE/.test(T);
  // em fatura, compra vem positiva: vira saída (negativa)
  if (fatura) for (const r of rows) r.valor = -r.valor;
  // saldo: "Saldo final/atual/disponível" no texto, ou a coluna de saldo da linha mais recente
  let saldo = null, saldoData = null;
  if (!fatura) {
    const sl = all.map(P.norm).filter(t => /SALDO (FINAL|ATUAL|DISPONIVEL|EM CONTA)/.test(t) && t.match(MONEY)).pop();
    const ultData = rows.reduce((m, r) => r.data > m ? r.data : m, '') || null;
    if (sl) { saldo = P.money(sl.match(MONEY).pop()); saldoData = ultData; }
    else if (ultSaldo && !isNaN(ultSaldo.v)) {
      const s = primSaldo && primSaldo.data > ultSaldo.data ? primSaldo : ultSaldo; // extrato do mais novo para o mais velho
      saldo = s.v; saldoData = s.data;
    }
  }
  return { formato: 'PDF', banco, tipo: fatura ? 'cartao' : 'conta', venc: vencISO, rows, generico: true, saldo, saldoData };
};

// ===================== Classificação =====================
P.SEED_RULES = [
  ['COPEL', 'Contas da casa', 'Luz'], ['SANEPAR', 'Contas da casa', 'Água'], ['JABANET', 'Contas da casa', 'Internet'],
  ['RECARGA DE CELULAR', 'Contas da casa', 'Celular'],
  ['AUTO POSTO', 'Carro', 'Gasolina'], ['AUTO PECAS', 'Carro', 'Consertos'], ['PNEU', 'Carro', 'Pneus'], ['COMBUSTIV', 'Carro', 'Gasolina'],
  ['PANIFICADORA', 'Mercado e padaria', 'Padaria'], ['PADARIA', 'Mercado e padaria', 'Padaria'],
  ['SUPERMERCADO', 'Mercado e padaria', 'Mercado'], ['ATACAD', 'Mercado e padaria', 'Mercado'],
  ['ODONTO', 'Saúde', 'Consultas e exames'], ['CLINICA', 'Saúde', 'Consultas e exames'], ['FARMACIA', 'Saúde', 'Farmácia'], ['DROGA', 'Saúde', 'Farmácia'],
  ['CALCADOS', 'Vestuário', 'Calçados'],
  ['BARBEARIA', 'Beleza', 'Barba'], ['BARBER', 'Beleza', 'Barba'], ['CABELEIREIR', 'Beleza', 'Corte de cabelo'], ['SALAO DE BELEZA', 'Beleza', 'Corte de cabelo'],
  ['MANICURE', 'Beleza', 'Manicure'], ['ESMALTERIA', 'Beleza', 'Manicure'],
  ['UTILIDADES', 'Casa e eletro', 'Utensílios para casa'], ['VARIEDADES', 'Variedades', ''], ['BAZAR', 'Variedades', ''],
  ['LANCHONETE', 'Comer fora', 'Restaurante'], ['LANCHES', 'Comer fora', 'Restaurante'], ['BURGUER', 'Comer fora', 'Restaurante'], ['BURGER', 'Comer fora', 'Restaurante'],
  ['SORVETERIA', 'Comer fora', 'Restaurante'], ['RESTAURANTE', 'Comer fora', 'Restaurante'], ['PIZZ', 'Comer fora', 'Restaurante'], ['IFOOD', 'Comer fora', 'Delivery'],
  ['NETFLIX', 'Assinaturas', 'Streaming'], ['SPOTIFY', 'Assinaturas', 'Streaming'], ['DISNEY', 'Assinaturas', 'Streaming'], ['PRIME VIDEO', 'Assinaturas', 'Streaming'],
  ['BONUS DA SORTE', 'Banco', 'Tarifas'], ['TARIFA', 'Banco', 'Tarifas'], ['IOF', 'Banco', 'Juros'], ['JUROS', 'Banco', 'Juros'],
  ['IPVA', 'Impostos e taxas', 'IPVA'], ['IPTU', 'Impostos e taxas', 'IPTU'], ['LICENCIAMENTO', 'Impostos e taxas', 'Licenciamento'],
  ['TRANSFERENCIA CONTA SALARIO', 'Salário', '', 'receita'], ['SALARIO', 'Salário', '', 'receita'],
  ['PAGAMENTO DE FATURA', '', '', 'pagdivida'], ['PAGAMENTO RECEBIDO', '', '', 'neutro'],
  ['BNC CADASTROS', 'BônusCred', '', 'pagdivida'], ['BONUSPAGO', 'BônusCred', '', 'pagdivida'],
  ['MIDWAY', 'Riachuelo', '', 'pagdivida'], ['SHPP BRASIL', 'Shopee', '', 'pagdivida'],
  ['RESGATE DE EMPRESTIMO', 'Empréstimo', '', 'pagdivida'],
  ['CREDITO EM CONTA', 'Empréstimo', '', 'entdivida'],
  ['VALOR ADICIONADO NA CONTA POR CARTAO DE CREDITO', '', '', 'neutro'],
  ['LIBERACAO DE DINHEIRO', 'Flash → Mercado Pago', '', 'transf'],
  ['DINHEIRO RESERVADO', 'Investimento', '', 'transf'], ['DINHEIRO RETIRADO', 'Investimento', '', 'transf'], ['COFRINHO', 'Investimento', '', 'transf'],
  ['DINHEIRO GUARDADO', 'Investimento', '', 'transf'], ['DINHEIRO RESGATADO', 'Investimento', '', 'transf'], ['APLICACAO RDB', 'Investimento', '', 'transf'], ['RESGATE RDB', 'Investimento', '', 'transf'],
  ['RENDIMENTO', 'Rendimentos', '', 'receita'],
  ['ANTECIPACAO SAQUE ANIVERSARIO', 'Adiantamento do FGTS', '', 'entdivida'], ['SAQUE ANIVERSARIO', 'Adiantamento do FGTS', '', 'entdivida'],
].map(([k, cat, sub, tipo]) => ({ k, cat, sub, tipo: tipo || 'despesa', espelho: k === 'LIBERACAO DE DINHEIRO' ? 'beneficio' : cat === 'Investimento' ? 'invest' : undefined }));

// rules: [{k, cat, sub, tipo}]; pessoas: [{aliases:[...]}]
P.classify = function (row, conta, rules, pessoas) {
  const N = P.norm(row.desc);
  const nome = P.norm(P.clean(row.desc).nome);
  // reversão de Pix no crédito (Nubank)
  if (/:REVERSAL$/i.test(row.fitid || '')) return { tipo: 'neutro', cat: '', sub: '', auto: 'regra' };
  const ehCartao = conta && (conta.tipo === 'cartao' || conta.tipo === 'loja');
  // limite do cartão que virou dinheiro na conta (Pix no crédito para vocês, "Limite convertido em saldo"):
  // a parcela é dívida, não gasto; o gasto é o que se faz depois com o dinheiro
  if (ehCartao && row.valor < 0) {
    const praVoces = /PIX NO CREDITO/.test(N) && (pessoas || []).some(p => (p.aliases || []).some(a => P.norm(a) && nome.includes(P.norm(a))));
    if (praVoces || /LIMITE CONVERTIDO/.test(N)) return { tipo: 'pagdivida', cat: 'Limite do cartão', sub: '', auto: 'limite' };
  }
  let best = null;
  for (const r of rules) {
    const k = P.norm(r.k);
    if (!k) continue;
    if ((r.exato ? nome === k : (N.includes(k) || nome.includes(k))) && (!best || k.length > P.norm(best.k).length || r.user && !best.user)) best = r;
  }
  if (best && (best.user || best.tipo !== 'despesa')) return { tipo: best.tipo, cat: best.cat, sub: best.sub, auto: 'regra', espelho: best.espelho };
  // transferência entre o casal
  for (const p of pessoas || []) for (const a of p.aliases || []) {
    const A = P.norm(a);
    if (A && (nome.startsWith(A) || nome.includes(A))) return { tipo: 'transf', cat: '', sub: '', auto: 'casal' };
  }
  if (best) return { tipo: best.tipo, cat: best.cat, sub: best.sub, auto: 'regra', espelho: best.espelho };
  if (conta && (conta.tipo === 'cartao' || conta.tipo === 'loja')) return { tipo: row.valor > 0 ? 'neutro' : 'despesa', cat: '', sub: '', auto: '' };
  return { tipo: row.valor >= 0 ? 'receita' : 'despesa', cat: '', sub: '', auto: '' };
};

// Pix devolvido: a devolução e o Pix original não contam como entrada nem gasto
P.isDevol = desc => /DEVOLU|PIX DEVOLVIDO|ESTORNO DE PIX|ESTORNO PIX|PIX ESTORNADO|^ESTORNO\b/.test(P.norm(desc));
// procura o lançamento original (valor oposto, até 30 dias antes) para uma devolução
P.achaOriginal = (dev, cands) => cands.find(o => o !== dev && !o._par && Math.abs(o.valor + dev.valor) < 0.005 && o.data <= dev.data && o.data >= P.addDays(dev.data, -30) && !P.isDevol(o.desc));

if (typeof module !== 'undefined') module.exports = P;

<script>
'use strict';
// ================= utilidades =================
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = v => BRL.format(Math.round((v || 0) * 100) / 100);
const brl0 = v => 'R$ ' + Math.round(v || 0).toLocaleString('pt-BR');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => { const d = new Date(); return P.iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const MES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const MESC = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const mkey = iso => iso.slice(0, 7);

function migra3() {

    // separa a parcela do nome
    const cl = P.clean(t.nome || t.desc);
    if (cl.parc && !t.parc) { t.parc = cl.parc; t.nome = cl.nome; t.upd = agora; }
    if (t.travado) continue;
    const c = conta(t.conta) || {};

    const k = P.classify({ desc: t.desc, valor: t.valor, fitid: '' }, c, [], S.pessoas);

  }

}

  let n = 0;
  for (const L of Object.values(porConta)) {

      if (!P.isDevol(d.desc) || d.travado) continue;
      if (d.tipo !== 'neutro') { d.tipo = 'neutro'; d.cat = ''; d.sub = ''; d.upd = Date.now(); n++; }
      const o = P.achaOriginal(d, L.filter(x => !x.travado));
      if (o) { o._par = 1; if (o.tipo !== 'neutro') { o.tipo = 'neutro'; o.cat = ''; o.sub = ''; o.upd = Date.now(); n++; } }
    }
  }

function vencCartao(c, data) {
  if (!c || !c.fech || !c.venc) return null;

function carregaScript(src) { return new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => err(new Error('Não consegui carregar ' + src)); document.head.appendChild(s); }); }

// Monta linhas de texto a partir do PDF, com 3+ espaços entre colunas
async function pdfLines(pdf) {
  const out = [];
  let yOff = 0;
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({
      x: i.transform[4], y: vp.height - i.transform[5], w: i.width, s: i.str, h: Math.abs(i.transform[3]) || 8,
    }));
    items.sort((a, b) => a.y - b.y || a.x - b.x);
    const rows = [];
    for (const it of items) {
      const r = rows.find(r => Math.abs(r.y - it.y) < Math.max(2.5, it.h * 0.35));
      if (r) r.items.push(it); else rows.push({ y: it.y, items: [it] });
    }
    rows.sort((a, b) => a.y - b.y);
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x);
      let text = '', end = null;
      for (const it of r.items) {
        if (end !== null) {
          const gap = it.x - end;
          const cw = it.h * 0.5;
          text += gap > cw * 1.6 ? '   ' : (gap > cw * 0.15 && !text.endsWith(' ') && !it.s.startsWith(' ') ? ' ' : '');
        }
        text += it.s;
        end = it.x + it.w;
      }
      out.push({ y: r.y + yOff, text: text.replace(/\s+$/, '') });
    }
    yOff += vp.height + 50;
  }
  return out;
}
if (typeof module !== 'undefined') module.exports = pdfLines;


async function lerArquivo(file) {
  const nome = file.name || 'arquivo';
  const ext = (nome.split('.').pop() || '').toLowerCase();
  const buf = await file.arrayBuffer();
  const head = new TextDecoder('latin1').decode(buf.slice(0, 600));
  if (ext === 'pdf' || head.startsWith('%PDF')) {
    const lib = await pdfjs();
    const pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    const lines = await pdfLines(pdf);
    return P.parsePDF(lines, new Date().getFullYear());
  }
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\uFFFD')) text = new TextDecoder('latin1').decode(buf);
  if (ext === 'ofx' || ext === 'qfx' || /<OFX>|OFXHEADER/i.test(text)) return P.parseOFX(text);
  if (ext === 'xlsx' || ext === 'xls') {
    const X = await xlsx(); const wb = X.read(buf, { type: 'array' });
    return P.parseCSV(X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: ';' }));
  }
  return P.parseCSV(text);
}

function montaPrevia(res, contaId, nomeArq) {
  const c = conta(contaId);
  const ids = new Set(S.tx.map(t => t.id));
  const linhas = res.rows.map(r => {
    const id = contaId + '|' + r.fitid;
    const cl = P.classify(r, c, S.regras, S.pessoas);
    const cln = P.clean(r.desc);
    return { r, id, dup: ids.has(id), sel: !ids.has(id), tipo: cl.tipo, cat: cl.cat, sub: cl.sub, auto: cl.auto, espelho: cl.espelho, nome: cln.nome, meio: cln.meio, parc: cln.parc };

  for (const l of linhas) {
    const m = String(l.r.fitid || '').match(/^(.*):reversal$/i); if (!m || l.dup) continue;

  }

  // Pix devolvido: a devolução e o Pix original viram "Ignorar"
  const jaTem = live().filter(t => t.conta === contaId && !t.travado).map(t => ({ t, valor: t.valor, data: t.data, desc: t.desc }));
  const cands = linhas.filter(l => !l.dup).map(l => ({ l, valor: l.r.valor, data: l.r.data, desc: l.r.desc })).concat(jaTem);
  for (const l of linhas) {
    if (l.dup || !P.isDevol(l.r.desc)) continue;
    Object.assign(l, { tipo: 'neutro', cat: '', sub: '', auto: 'devol', espelho: undefined });
    const o = P.achaOriginal({ valor: l.r.valor, data: l.r.data, desc: l.r.desc }, cands);
    if (!o) continue;
    o._par = 1;
    if (o.l) Object.assign(o.l, { tipo: 'neutro', cat: '', sub: '', auto: 'devol' }); else l.parTx = o.t.id;
  }

}

function mapearCSV(f, res) {

function rDividas() {
  const hoje = today();

    ${b.prox ? `<div class="small" style="margin-top:10px">Próximo vencimento: <b>${dlabel(b.prox.venc)}</b></div>` : ''}
    ${meses.length ? `<div class="row wrap" style="gap:6px;margin-top:8px">${meses.map(([k, v]) => `<span class="tag">${MESC[+k.slice(5) - 1]}/${k.slice(2, 4)} · ${esc(brl0(v))}</span>`).join('')}</div>` : ''}

  const s = sheet(`<div class="row between"><h2 style="margin:0">${novo ? 'Nova categoria' : esc(c.e + ' ' + c.nome)}</h2><button class="iconbtn" data-fechar aria-label="Fechar">${ic('x')}</button></div>
  ${novo ? `<div class="grid2"><div><label class="l">Nome</label><input class="f" id="ca-nome"></div><div><label class="l">Emoji</label><input class="f" id="ca-e" value="📦"></div></div>` : ''}
  <label class="l">Subcategorias (separadas por vírgula)</label><input class="f" id="ca-subs" value="${esc(c.subs.join(', '))}">
  <label class="l">Limite por mês (R$, opcional)</label><input class="f" id="ca-orc" inputmode="decimal" value="${S.orc[c.nome] ? String(S.orc[c.nome]).replace('.', ',') : ''}" placeholder="Sem limite">
  <div class="grid2" style="margin-top:18px">${novo ? '<button class="btn" data-fechar>Cancelar</button>' : '<button class="btn danger" id="ca-del">Excluir</button>'}<button class="btn pri" id="ca-ok">Salvar</button></div>`);
  if (!novo) s.querySelector('#ca-del').onclick = () => confirma('Excluir a categoria ' + c.nome + '? Os lançamentos ficam sem categoria.', () => { S.cats.despesa.splice(i, 1); live().forEach(t => { if (t.tipo === 'despesa' && t.cat === c.nome) { t.cat = ''; t.sub = ''; t.upd = Date.now(); } }); save(); s.remove(); render(); }, 'Excluir');
  s.querySelector('#ca-ok').onclick = () => {
    if (novo) { c.nome = s.querySelector('#ca-nome').value.trim(); c.e = s.querySelector('#ca-e').value.trim() || '📦'; if (!c.nome) { toast('Dê um nome'); return; } const cores = ['#2F7BE5', '#E36A2E', '#11935A', '#9B51E0', '#0E9AA7', '#C2185B']; c.cor = cores[S.cats.despesa.length % cores.length]; S.cats.despesa.push(c); }
    c.subs = s.querySelector('#ca-subs').value.split(',').map(x => x.trim()).filter(Boolean);
    const o = P.money(s.querySelector('#ca-orc').value); if (o > 0) S.orc[c.nome] = o; else delete S.orc[c.nome]; (S.orcUpd = S.orcUpd || {})[c.nome] = Date.now();
    save(false); s.remove(); render(); toast('Categoria salva');
  };
}

// ================= BACKUP (xlsx) =================
async function salvarBackup() {
  const btn = $('#bk-salvar'); btn.textContent = 'Preparando…';
  try {
    const X = await xlsx();
    const wb = X.utils.book_new();
    const add = (nome, rows) => X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows.length ? rows : [{}]), nome);
    add('Lançamentos', S.tx.slice().sort((a, b) => a.data.localeCompare(b.data)).map(t => { const c = conta(t.conta) || {}; return {
      Data: t.data, Descrição: t.nome || t.desc, Valor: t.valor, Tipo: TIPOS[t.tipo] || t.tipo, Categoria: t.cat || '', Subcategoria: t.sub || '', Conta: c.nome || '', De: donoNome(c.dono),
      Vencimento: t.venc || '', 'No extrato': t.desc || '', id: t.id, conta_id: t.conta, tipo_id: t.tipo, meio: t.meio || '', criado: t.criado || 0, upd: t.upd || 0, excluido: t.del ? 1 : 0, travado: t.travado ? 1 : 0 }; }));
    add('Contas', S.contas.map(c => ({ id: c.id, Nome: c.nome, De: c.dono, Tipo: c.tipo, Banco: c.banco || '', Fechamento: c.fech || '', Vencimento: c.venc || '', PrazoDias: c.prazo || '', SaldoInicial: c.saldoIni || 0, SaldoRef: c.saldoRef ? c.saldoRef.valor : '', SaldoRefData: c.saldoRef ? c.saldoRef.data : '', chaves: (c.chaves || []).join(' | '), upd: c.upd || 0 })));
    add('Dívidas', S.contratos.map(c => ({ id: c.id, Nome: c.nome, De: c.dono, Tipo: c.tipo, Parcela: c.parcela, Total: c.total, Pagas: c.pagas, Dia: c.dia, upd: c.upd || 0 })));
    add('Categorias', ['despesa', 'receita', 'entdivida'].flatMap(tp => S.cats[tp].map(c => ({ tipo: tp, Nome: c.nome, Emoji: c.e, Cor: c.cor, Subcategorias: c.subs.join(' | '), Orçamento: S.orc[c.nome] || '', orc_upd: (S.orcUpd || {})[c.nome] || 0 }))));
    add('Regras', S.regras.filter(r => r.user).map(r => ({ Texto: r.k, Tipo: r.tipo, Categoria: r.cat || '', Subcategoria: r.sub || '', upd: r.upd || 0 })));
    add('Pessoas', S.pessoas.map(p => ({ id: p.id, Nome: p.nome, Nomes_no_extrato: p.aliases.join(' | ') })));
    add('Info', [{ app: 'Finanças da Família', versao: 2, salvo_por: S.eu, salvo_em: new Date().toISOString() }]);
    const out = X.write(wb, { type: 'array', bookType: 'xlsx' });
    const nome = 'financas-' + P.norm(donoNome(S.eu).split(' ')[0]).toLowerCase() + '-' + today() + '.xlsx';
    const file = new File([out], nome, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup Finanças' });
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = nome; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    }
    S.ultimoBackup = Date.now(); S.mud = 0; save(false); render(); toast('Backup salvo');
  } catch (e) {
    const code = e && e.code;
    toast(e && e.name === 'AbortError' ? 'Backup cancelado' : 'Não consegui salvar o backup' + (e && e.message ? ': ' + e.message : ''));
  } finally { const b = $('#bk-salvar'); if (b) b.textContent = 'Salvar backup'; }
}
async function lerBackup(file) {
  const X = await xlsx();
  const wb = X.read(await file.arrayBuffer(), { type: 'array' });
  const sh = n => wb.Sheets[n] ? X.utils.sheet_to_json(wb.Sheets[n], { defval: '' }) : [];
  if (!wb.Sheets['Lançamentos'] || !wb.Sheets['Contas']) throw new Error('Esse arquivo não é um backup deste app');
  const str = v => v == null ? '' : String(v);
  const tx = sh('Lançamentos').filter(r => r.id).map(r => ({ id: str(r.id), conta: str(r.conta_id), data: str(r.Data).slice(0, 10), nome: str(r['Descrição']), desc: str(r['No extrato']) || str(r['Descrição']), valor: +r.Valor || 0, tipo: str(r.tipo_id) || 'despesa', cat: str(r.Categoria), sub: str(r.Subcategoria), venc: str(r.Vencimento) || undefined, meio: str(r.meio), criado: +r.criado || 0, upd: +r.upd || 0, del: +r.excluido === 1 || undefined, travado: +r.travado === 1 || undefined }));
  const contas = sh('Contas').filter(r => r.id).map(r => ({ id: str(r.id), nome: str(r.Nome), dono: str(r.De), tipo: str(r.Tipo), banco: str(r.Banco), fech: +r.Fechamento || null, venc: +r.Vencimento || null, prazo: +r.PrazoDias || null, saldoIni: +r.SaldoInicial || 0, saldoRef: r.SaldoRefData !== '' && r.SaldoRefData != null && r.SaldoRef !== '' ? { valor: +r.SaldoRef || 0, data: str(r.SaldoRefData).slice(0, 10) } : undefined, chaves: str(r.chaves).split(' | ').filter(Boolean), upd: +r.upd || 0 }));
  const contratos = sh('Dívidas').filter(r => r.id).map(r => ({ id: str(r.id), nome: str(r.Nome), dono: str(r.De), tipo: str(r.Tipo), parcela: +r.Parcela || 0, total: +r.Total || 0, pagas: +r.Pagas || 0, dia: +r.Dia || 1, upd: +r.upd || 0 }));
  const cats = { despesa: [], receita: [], entdivida: [] }, orc = {}, orcUpd = {};
  for (const r of sh('Categorias')) { if (!cats[r.tipo]) continue; cats[r.tipo].push({ nome: str(r.Nome), e: str(r.Emoji), cor: str(r.Cor), subs: str(r.Subcategorias).split(' | ').filter(Boolean) }); if (+r['Orçamento']) orc[str(r.Nome)] = +r['Orçamento']; if (+r.orc_upd) orcUpd[str(r.Nome)] = +r.orc_upd; }
  const regras = sh('Regras').filter(r => r.Texto).map(r => ({ k: str(r.Texto), tipo: str(r.Tipo), cat: str(r.Categoria), sub: str(r.Subcategoria), user: true, upd: +r.upd || 0 }));
  const pessoas = sh('Pessoas').filter(r => r.id).map(r => ({ id: str(r.id), nome: str(r.Nome), aliases: str(r.Nomes_no_extrato).split(' | ').filter(Boolean) }));
  const info = sh('Info')[0] || {};
  return { tx, contas, contratos, cats, orc, orcUpd, regras, pessoas, de: str(info.salvo_por) };
}
$('#bkIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const B = await lerBackup(f);
    if (V.bkModo === 'abrir') {
      confirma(`Substituir tudo deste celular pelo backup (${B.tx.filter(t => !t.del).length} lançamentos)?`, () => {
        const eu = S.eu; const base = seed();
        S = Object.assign(base, { tx: B.tx, contas: B.contas.length ? B.contas : base.contas, contratos: B.contratos, orc: B.orc, orcUpd: B.orcUpd, pessoas: B.pessoas.length ? B.pessoas : base.pessoas, eu, ultimoBackup: Date.now(), mud: 0 });
        if (B.cats.despesa.length) S.cats = B.cats;
        S.regras = base.regras.concat(B.regras);
        S.mig = 1; migra();
        save(false); render(); toast('Backup aberto');
      }, 'Substituir');
    } else {
      // juntar: o mais recente vence; nada é apagado sem marca de exclusão
      let novos = 0, atual = 0;
      const mapa = new Map(S.tx.map(t => [t.id, t]));
      for (const t of B.tx) { const a = mapa.get(t.id); if (!a) { S.tx.push(t); if (!t.del) novos++; } else if ((t.upd || 0) > (a.upd || 0)) { Object.assign(a, t); atual++; } }
      for (const c of B.contas) { const a = conta(c.id); if (!a) S.contas.push(c); else { if ((c.upd || 0) > (a.upd || 0)) Object.assign(a, c, { chaves: [...new Set([...(a.chaves || []), ...c.chaves])] }); else a.chaves = [...new Set([...(a.chaves || []), ...c.chaves])]; } }
      for (const c of B.contratos) { const a = S.contratos.find(x => x.id === c.id); if (!a) S.contratos.push(c); else if ((c.upd || 0) > (a.upd || 0)) Object.assign(a, c); }
      for (const r of B.regras) { const a = S.regras.find(x => x.user && P.norm(x.k) === P.norm(r.k)); if (!a) S.regras.push(r); else if ((r.upd || 0) > (a.upd || 0)) Object.assign(a, r); }
      for (const tp of ['despesa', 'receita', 'entdivida']) for (const c of B.cats[tp]) { const a = S.cats[tp].find(x => x.nome === c.nome); if (!a) S.cats[tp].push(c); else a.subs = [...new Set([...a.subs, ...c.subs])]; }
      // orçamentos: vale o alterado por último (backups antigos, sem data, só preenchem o que falta)
      S.orcUpd = S.orcUpd || {};
      for (const k in B.orcUpd) if (B.orcUpd[k] > (S.orcUpd[k] || 0)) { if (B.orc[k] > 0) S.orc[k] = B.orc[k]; else delete S.orc[k]; S.orcUpd[k] = B.orcUpd[k]; }
      for (const k in B.orc) if (!B.orcUpd[k] && !S.orc[k]) S.orc[k] = B.orc[k];
      save(); render();
      sheet(`<div style="text-align:center"><div style="font-size:40px">🤝</div><h2>Backup juntado</h2><p class="muted">${novos} lançamento(s) novo(s) de ${esc(donoNome(B.de) || 'outro celular')}${atual ? ` e ${atual} atualizado(s)` : ''}.</p><button class="btn pri full" data-fechar>Ok</button></div>`);
    }
  } catch (err) { toast(err.message || 'Não consegui abrir o backup'); }
};

// ================= início =================
migra();
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(ok => ok || navigator.storage.persist()).catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
