<style>

hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}

.ic svg{display:block}.ic.bk{position:relative;overflow:hidden}.ic.bk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

<script>
// ===== Leitores de arquivos (OFX, CSV, PDF) e classificação =====
const P = {};

P.norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();

P.money = function (raw) {
  if (raw == null) return NaN;
  let s = String(raw).trim();
  let neg = /^-|^\(|-\s*R\$|R\$\s*-|\s-$|\bD$/i.test(s);
  s = s.replace(/[^\d.,]/g, '');
  if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) {
    if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  } else if (lc > -1) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (ld > -1) {
    const parts = s.split('.');
    if (parts.length > 2 || (parts[1] && parts[1].length === 3 && parts.length === 2 && /^\d{1,3}$/.test(parts[0]) && false)) s = s.replace(/\./g, '');
  }
  const v = parseFloat(s);
  return isNaN(v) ? NaN : (neg ? -v : v);
};

const MESES = { JAN: 1, FEV: 2, FEB: 2, MAR: 3, ABR: 4, APR: 4, MAI: 5, MAY: 5, JUN: 6, JUL: 7, AGO: 8, AUG: 8, SET: 9, SEP: 9, OUT: 10, OCT: 10, NOV: 11, DEZ: 12, DEC: 12 };
P.pad = n => String(n).padStart(2, '0');
P.iso = (y, m, d) => `${y}-${P.pad(m)}-${P.pad(d)}`;
P.date = function (raw, refYear) {
  const s = String(raw || '').trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return P.iso(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return P.iso(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) {
    let y = +m[3]; if (y < 100) y += 2000; return P.iso(y, +m[2], +m[1]);
  }
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})$/)) && refYear) return P.iso(refYear, +m[2], +m[1]);
  if ((m = P.norm(s).match(/^(\d{1,2})\s*(?:DE\s*)?([A-Z]{3})/)) && MESES[m[2]] && refYear) return P.iso(refYear, MESES[m[2]], +m[1]);
  return null;
};
P.addDays = function (iso, n) {
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n);
  return P.iso(d.getFullYear(), d.getMonth() + 1, d.getDate());
};

// --- descrição limpa (nome do estabelecimento / pessoa)
P.clean = function (desc) {
  let s = String(desc || '').replace(/\s+/g, ' ').trim();
  let meio = '';
  const pref = [
    [/^Transfer[êe]ncia enviada pelo Pix - /i, 'Pix enviado'],
    [/^Transfer[êe]ncia recebida pelo Pix - /i, 'Pix recebido'],
    [/^Transfer[êe]ncia recebida - /i, 'Pix recebido'],
    [/^Transfer[êe]ncia enviada - /i, 'Pix enviado'],
    [/^Estorno - Transfer[êe]ncia enviada pelo Pix - /i, 'Estorno'],
    [/^Estorno - /i, 'Estorno'],
    [/^Pix no Cr[ée]dito - /i, 'Pix no crédito'],
    [/^Compra no d[ée]bito - /i, 'Débito'],
    [/^Compra no cr[ée]dito - /i, 'Crédito'],
    [/^PAGAMENTO PIX - /i, 'Pix enviado'],
    [/^RECEBIMENTO PIX - /i, 'Pix recebido'],
    [/^CARTAO DEBITO - /i, 'Débito'],
    [/^Pix enviado:? - /i, 'Pix enviado'],
    [/^Pix recebido:? - /i, 'Pix recebido'],
    [/^Pix enviado /i, 'Pix enviado'],
    [/^Pix recebido /i, 'Pix recebido'],
    [/^Pagamento com Pix /i, 'Pix enviado'],
    [/^Pagamento efetuado - /i, 'Pagamento'],
    [/^Pagamento de boleto efetuado - /i, 'Boleto'],
    [/^PIX ENVIADO\s*-?\s*/i, 'Pix enviado'],
    [/^PIX RECEBIDO\s*-?\s*/i, 'Pix recebido'],
  ];
  for (const [re, t] of pref) if (re.test(s)) { s = s.replace(re, ''); meio = t; break; }
  s = s.replace(/^\d{8,14}\s+/, '');             // CPF/CNPJ no início (Sicredi, Inter)
  s = s.replace(/^\d{2}\.\d{3}\.\d{3}\s+/, '');   // CNPJ de MEI no nome
  s = s.replace(/\s+\d{11,14}$/, '');           // CPF/CNPJ no fim (Mercado Pago)
  s = s.split(/ - (?:•|\*|\d{2}\.\d{3}\.\d{3}\/|\d{3}\.\d{3}\.\d{3}-)/)[0];
  s = s.replace(/ - BR$/i, '').replace(/\s*-\s*$/, '').trim();
  // parcela no fim do nome: "MIDWAY - 3/4", "LOJA 03/10", "Parcela 2/5"
  let parc = '';
  const mp = s.match(/\s*(?:-\s*)?(?:PARCELA\s*)?(\d{1,2})\s*\/\s*(\d{1,2})$/i);
  if (mp && +mp[1] >= 1 && +mp[1] <= +mp[2] && +mp[2] > 1 && s.length > mp[0].length) { parc = +mp[1] + '/' + +mp[2]; s = s.slice(0, s.length - mp[0].length).replace(/\s*-\s*$/, '').trim(); }
  return { nome: s || String(desc || '').trim(), meio, parc };
};

// ===================== OFX =====================
P.parseOFX = function (text) {
  const tag = (blk, t) => { const m = blk.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  const org = tag(text, 'ORG'), bankid = tag(text, 'BANKID');
  const isCard = /<CREDITCARDMSGSRSV1>|<CCACCTFROM>/i.test(text);
  const acct = tag(text, 'ACCTID');
  const rows = [];
  const re = /<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi;
  let m;
  while ((m = re.exec(text))) {
    const b = m[1];
    const valor = parseFloat(tag(b, 'TRNAMT').replace(',', '.'));
    const memo = tag(b, 'MEMO') || tag(b, 'NAME');
    const name = tag(b, 'NAME');
    let desc = memo && name && !memo.includes(name) ? name + ' - ' + memo : memo;
    // Inter: MEMO = 'Pix enviado: "Cp :1954-6924 Fulano"', NAME = 'Fulano' -> "Pix enviado - Fulano"
    const mi = memo.match(/^(Pix enviado|Pix recebido|Transfer[êe]ncia recebida|Transfer[êe]ncia enviada|Pagamento efetuado|Pagamento de boleto|Compra no d[ée]bito)[^:]*:/i);
    if (mi && name) desc = mi[1] + ' - ' + name;
    rows.push({ data: P.date(tag(b, 'DTPOSTED')), valor, desc, fitid: tag(b, 'FITID') });
  }
  const bal = tag(text, 'BALAMT'), balData = P.date(tag(text, 'DTASOF'));
  let banco = org || bankid;
  if (/NU PAGAMENTOS|^0?260$/i.test(banco) || bankid === '0260') banco = 'Nubank';
  else if (/SICREDI|^748$/i.test(banco) || bankid === '748' || bankid === '0748') banco = 'Sicredi';
  else if (/INTER|^077$/i.test(banco) || bankid === '077' || bankid === '0077') banco = 'Inter';
  else if (/MERCADO ?PAGO|^323$/i.test(banco) || bankid === '0323') banco = 'Mercado Pago';
  return { formato: 'OFX', banco, tipo: isCard ? 'cartao' : 'conta', acctKey: (banco || '') + ':' + acct, saldo: bal ? parseFloat(bal.replace(',', '.')) : null, saldoData: balData, rows };
};

// ===================== CSV =====================
P.splitCSV = function (text) {
  text = text.replace(/^﻿/, '');
  const lines = text.split(/\r?\n/);
  const sample = lines.slice(0, 15).join('\n');
  const sc = (sample.match(/;/g) || []).length, cc = (sample.match(/,/g) || []).length, tc = (sample.match(/\t/g) || []).length;
  const d = tc > sc && tc > cc ? '\t' : (sc >= cc * 0.5 && sc > 0 ? ';' : ',');
  const out = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const cells = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true; else if (ch === d) { cells.push(cur.trim()); cur = ''; } else cur += ch;
    }
    cells.push(cur.trim()); out.push(cells);
  }
  return out;
};

P.csvGuess = function (rows) {
  // procura a linha de cabeçalho e as colunas de data, descrição e valor
  for (let h = 0; h < Math.min(rows.length, 25); h++) {
    const H = rows[h].map(P.norm);
    const fi = re => H.findIndex(c => re.test(c));
    let data = fi(/^(DATA|DATE|DT)( |$|_)|^DATA LANCAMENTO|^RELEASE_DATE|^DATA DA COMPRA|^DATA DE LANCAMENTO/);
    let valor = fi(/^(VALOR|AMOUNT|TRANSACTION_NET_AMOUNT|VALOR \(R\$\)|VALOR EM R\$|VALOR R\$)$/);
    if (valor < 0) valor = fi(/VALOR|AMOUNT/);
    let desc = fi(/^(DESCRICAO|DESCRIPTION|TITLE|HISTORICO|TRANSACTION_TYPE|ESTABELECIMENTO|LANCAMENTO)$/);
    if (desc < 0) desc = fi(/DESCRI|HISTOR|TITLE|ESTABELEC/);
    const id = fi(/^(IDENTIFICADOR|ID|REFERENCE_ID|ID DA OPERACAO|CODIGO)$/);
    const hist = fi(/^HISTORICO$/);
    let saldo = fi(/^(SALDO|SALDO \(R\$\)|SALDO EM R\$|SALDO R\$|SALDO DO DIA|BALANCE|PARTIAL_BALANCE)$/);
    if (saldo < 0) saldo = fi(/SALDO|BALANCE/);
    if (saldo === valor) saldo = -1;
    if (data > -1 && valor > -1 && desc > -1) return { header: h, data, valor, desc, id, saldo, hist: hist !== desc ? hist : -1, cols: rows[h] };
  }
  return null;
};

P.parseCSV = function (text, map) {
  const rows = P.splitCSV(text);
  const g = map || P.csvGuess(rows);
  const H = g ? rows[g.header].map(P.norm).join('|') : '';
  let banco = '', tipo = 'conta', inv = false;
  if (/IDENTIFICADOR/.test(H) && /CODTRANSACAO/.test(H)) banco = 'Sicredi';
  else if (/^DATA\|VALOR\|IDENTIFICADOR\|DESCRICAO/.test(H)) banco = 'Nubank';
  else if (/^DATE\|TITLE\|AMOUNT/.test(H)) { banco = 'Nubank'; tipo = 'cartao'; inv = true; }
  else if (/RELEASE_DATE/.test(H)) banco = 'Mercado Pago';
  else if (/DATA LANCAMENTO/.test(H) && /HISTORICO/.test(H)) banco = 'Inter';
  if (!g) return { formato: 'CSV', banco, tipo, rows: [], needMap: true, preview: rows.slice(0, 8) };
  const out = [];
  const seen = {};
  const saldos = []; // [data, saldo, ordem]
  for (let i = g.header + 1; i < rows.length; i++) {
    const r = rows[i];
    const data = P.date(r[g.data]);
    let valor = P.money(r[g.valor]);
    if (!data || isNaN(valor)) continue;
    if (g.saldo > -1 && r[g.saldo] !== undefined && r[g.saldo] !== '') { const sv = P.money(r[g.saldo]); if (!isNaN(sv)) saldos.push([data, sv, i]); }
    if (inv || (map && map.inverter)) valor = -valor;
    let desc = r[g.desc] || '';
    if (g.hist > -1 && r[g.hist] && !desc.includes(r[g.hist])) desc = r[g.hist] + ' - ' + desc;
    let fitid = g.id > -1 ? r[g.id] : '';
    if (!fitid) { const k = data + '|' + valor + '|' + P.norm(desc); seen[k] = (seen[k] || 0) + 1; fitid = 'h:' + k + '|' + seen[k]; }
    out.push({ data, valor, desc, fitid });
  }
  let saldo = null, saldoData = null;
  if (saldos.length) {
    // o saldo mais recente: se o arquivo está do mais novo para o mais velho, é o primeiro do último dia
    const desc = saldos.length > 1 && saldos[0][0] > saldos[saldos.length - 1][0];
    const ult = saldos.reduce((m, s) => s[0] > m ? s[0] : m, '');
    const doDia = saldos.filter(s => s[0] === ult);
    const s = desc ? doDia[0] : doDia[doDia.length - 1]; saldo = s[1]; saldoData = s[0];
  } else {
    // Mercado Pago: linha FINAL_BALANCE no topo
    for (let i = 0; i < Math.min(rows.length - 1, 6); i++) { const k = rows[i].map(P.norm).indexOf('FINAL_BALANCE'); if (k > -1) { const sv = P.money(rows[i + 1][k]); if (!isNaN(sv)) { saldo = sv; saldoData = out.reduce((m, r) => r.data > m ? r.data : m, '') || null; } break; } }
  }
  return { formato: 'CSV', banco, tipo, rows: out, map: g, header: rows[g.header], saldo, saldoData };
};

// ===================== PDF =====================
// lines: [{y, text}] já montadas com espaços entre colunas (3+ espaços = coluna)
P.parsePDF = function (lines, refYear) {
  const all = lines.map(l => l.text);
  const T = P.norm(all.join('\n'));
  const MONEY = /-?\s*R?\$?\s*-?\d{1,3}(?:\.\d{3})*,\d{2}/g;

  // --- Contrato de crédito (Mercado Pago "Documento Descritivo de Crédito" / Nubank "Contrato de Empréstimo")
  const MESN = { JAN: 1, FEV: 2, MAR: 3, ABR: 4, MAI: 5, JUN: 6, JUL: 7, AGO: 8, SET: 9, OUT: 10, NOV: 11, DEZ: 12 };
  const dataExt = s => { const m = P.norm(s).match(/(\d{1,2})\s*(?:\/|DE)\s*([A-Z]{3})[A-Z]*\s*(?:\/|DE)\s*(\d{4})/); return m && MESN[m[2]] ? P.iso(+m[3], MESN[m[2]], +m[1]) : null; };
  const achaV = re => { const l = all.find(t => re.test(P.norm(t))); if (!l) return null; const v = P.norm(l).replace(/^.*?(?=R\$)/, '').match(/R\$\s*([\d.]+(?:,\d{2})?)/); return v ? P.money(v[1]) : null; };
  if (/DOCUMENTO DESCRITIVO DE CREDITO/.test(T)) {
    const parc = [];
    for (const t of all) {
      const m = t.match(/^\s*(\d{1,2})\s+(\d{1,2}\/[a-zç]{3}\/\d{4})\s+(\S+)\s+([\d.]+)\s.*?(Paga|Programada|Atrasada|Vencida|Em aberto)/i);
      if (m) parc.push({ n: +m[1], venc: dataExt(m[2]), valor: +m[4], pago: /PAGA/i.test(m[5]), pagoEm: dataExt(m[3]) || undefined });
    }
    const L = n => (all.find(t => P.norm(t).includes(n)) || '');
    const num = (L('CONTRATO #').match(/#\s*(\d+)/) || [])[1] || '';
    const tipoOp = (L('TIPO DA OPERACAO').split(':')[1] || '').trim();
    const cliente = ((L('CLIENTE:').match(/Cliente:\s*(.*?)(\s{2,}|$)/i) || [])[1] || '').trim();
    const jur = (P.norm(L('TAXA DE JUROS AO MES')).match(/AO MES\s+([\d,]+)%/) || [])[1];
    return { formato: 'PDF', banco: 'Mercado Pago', tipo: 'contrato', rows: [], contrato: {
      numero: num, banco: 'Mercado Pago', credor: 'Mercado Pago', nome: (tipoOp || 'Empréstimo') + ' Mercado Pago', cliente,
      contratado: dataExt(L('DATA DE CONTRATACAO')), liberado: achaV(/VALOR DO CREDITO CONCEDIDO/), totalPagar: achaV(/VALOR TOTAL A PAGAR/),
      juros: jur ? P.money(jur) : null, parcelas: parc } };
  }
  if (/CONTRATO DE EMPRESTIMO PESSOAL|QUADRO RESUMO/.test(T) && /NUBANK|NU FINANCEIRA|NU PAGAMENTOS/.test(T) && /VENCIMENTO DAS/.test(T)) {
    const parc = [];
    for (const t of all) { const m = t.match(/(\d{1,2})ª\s*-\s*(\d{2}\/\d{2}\/\d{4})(?:\s*\((\d{2}\/\d{2}\/\d{4})\))?\s*-\s*R\$\s*([\d.]+,\d{2})/); if (m) parc.push({ n: +m[1], venc: P.date(m[3] || m[2]), valor: P.money(m[4]), pago: false }); }
    const L = n => (all.find(t => P.norm(t).includes(n)) || '');
    const jur = (P.norm(L('JUROS MENSAL')).match(/([\d,]+)%/) || [])[1];
    const cliente = (L('NOME').replace(/^\s*Nome\s+/i, '') || '').trim();
    return { formato: 'PDF', banco: 'Nubank', tipo: 'contrato', rows: [], contrato: {
      numero: (L('NUMERO DO CONTRATO').match(/(\d{6,})/) || [])[1] || '', banco: 'Nubank', credor: 'Nubank', nome: 'Empréstimo Nubank', cliente,
      contratado: P.date((L('DATA E HORA DE').match(/(\d{2}\/\d{2}\/\d{4})/) || [])[1]), liberado: achaV(/VALOR LIBERADO AO/), totalPagar: achaV(/^TOTAL A PAGAR/),
      juros: jur ? P.money(jur) : null, parcelas: parc.sort((a, b) => a.n - b.n) } };
  }

  // --- Fatura do cartão Riachuelo (Midway)
  if (/MIDWAY|RIACHUELO|RCHLO/.test(T) && /HISTORICO DE DESPESAS/.test(T)) {
    const iv = all.findIndex(t => /^\s*VENCIMENTO\b/.test(P.norm(t)));
    const vencR = iv > -1 ? P.date((all.slice(iv + 1, iv + 4).join(' ').match(/(\d{2}\/\d{2}\/\d{4})/) || [])[1]) : null;
    const rows = [], seen = {};
    for (const t of all) {
      const m = t.match(/^\s*(\d{2}\/\d{2}\/\d{2,4})\s+(\d{3})\s+(.+?)\s{2,}(.*?)([+-])\s*([\d.]+,\d{2})\s*$/);
      if (!m) continue;
      const data = P.date(m[1]); if (!data) continue;
      let desc = m[3].trim(); const meio = m[4];
      const pm = meio.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})\b/); if (pm && +pm[2] > 1) desc += ' ' + +pm[1] + '/' + +pm[2];
      const valor = (m[5] === '+' ? -1 : 1) * P.money(m[6]);
      const k = data + '|' + valor + '|' + P.norm(desc); seen[k] = (seen[k] || 0) + 1;
      rows.push({ data, valor, desc, fitid: 'ri:' + k + '|' + seen[k], venc: vencR || undefined });
    }
    return { formato: 'PDF', banco: 'Riachuelo', tipo: 'loja', venc: vencR, rows };
  }

  // --- BônusCred: compras com vencimento individual (30 dias após a compra)
  if (/BONUSCRED|BONUS ?CRED/.test(T) || (/DOCUMENTO/.test(T) && /VENCIMENTO/.test(T) && /A VENCER|VENCIDO|PAGO/.test(T))) {
    const rows = [];
    for (const t of all) {
      const m = t.match(/^\s*(\S+)\s{2,}(.+?)\s{2,}(\d{2}\/\d{2}\/\d{4})\s{2,}(.*?)\s{2,}(-?[\d.]+,\d{2})\s*$/);
      if (!m) continue;
      const venc = P.date(m[3]);
      rows.push({ data: P.addDays(venc, -30), venc, valor: -Math.abs(P.money(m[5])), desc: m[2].trim(), fitid: 'bc:' + m[1], obs: m[4].trim(), aberto: true });
    }
    return { formato: 'PDF', banco: 'BônusCred', tipo: 'loja', prazo: 30, rows };
  }

  // --- Mercado Pago: extrato de conta (descrição pode quebrar em 2 linhas)
  if (/MERCADO PAGO/.test(T) && /DETALHE DOS MOVIMENTOS/.test(T)) {
    const start = all.findIndex(t => /DETALHE DOS MOVIMENTOS/i.test(P.norm(t)));
    let end = all.findIndex((t, i) => i > start && /DATA DE GERACAO|VOCE TEM ALGUMA DUVIDA/.test(P.norm(t)));
    if (end < 0) end = all.length;
    let pg = 0; const sec = [];
    for (const l of lines.slice(start + 1, end)) { const N = P.norm(l.text).trim();
      if (/^\d+\s*\/\s*\d+$/.test(N)) { pg++; continue; }
      if (/^DATA\s*(DATA)?\s*DESCRI|ID DA OPERACAO|DESCRICAO\s*DESCRICAO/.test(N)) continue;
      sec.push(Object.assign({}, l, { pg })); }
    const anchors = [];
    sec.forEach((l, i) => { if (/^\s*\d{2}-\d{2}-\d{4}/.test(l.text)) anchors.push(i); });
    const rows = anchors.map(i => {
      const l = sec[i];
      const m = l.text.match(/^\s*(\d{2}-\d{2}-\d{4})\s*(.*?)\s{2,}(\d{6,})\s+(R\$\s*-?[\d.]+,\d{2})/) || l.text.match(/^\s*(\d{2}-\d{2}-\d{4})\s*(.*?)\s*(\d{6,})\s+(R\$\s*-?[\d.]+,\d{2})/);
      if (!m) return null;
      const after = l.text.slice(l.text.indexOf(m[4]) + m[4].length).match(/R\$\s*-?[\d.]+,\d{2}/);
      return { y: l.y, data: P.date(m[1]), desc: m[2].trim(), fitid: 'mp:' + m[3], valor: P.money(m[4]), _saldo: after ? P.money(after[0]) : null };
    }).filter(Boolean);
    rows.forEach((r, k) => { r.pg = sec[anchors[k]].pg; });
    sec.forEach((l, i) => {
      if (anchors.includes(i) || !l.text.trim()) return;
      let best = null, bd = 1e9;
      for (const r of rows) { if (r.pg !== l.pg) continue; const d = Math.abs(r.y - l.y); if (d < bd) { bd = d; best = r; } }
      if (best && bd < 16) (best.extra = best.extra || []).push({ y: l.y, t: l.text.trim() });
      else { const prox = rows.find(r => r.pg === l.pg + 1); const ult = !rows.some(r => r.pg === l.pg && r.y > l.y); if (ult && prox) (prox.extra = prox.extra || []).push({ y: -1, t: l.text.trim() }); }
    });
    for (const r of rows) {
      const parts = [{ y: r.y, t: r.desc }].concat(r.extra || []).filter(p => p.t).sort((a, b) => a.y - b.y);
      r.desc = parts.map(p => p.t).join(' ').replace(/\s+/g, ' ').trim();
      delete r.extra; delete r.y; delete r.pg;
    }
    let saldo = null, saldoData = null;
    const sf = all.map(P.norm).find(t => /SALDO FINAL/.test(t));
    const ultData = rows.reduce((m, r) => r.data > m ? r.data : m, '') || null;
    if (sf && sf.match(MONEY)) { saldo = P.money(sf.match(MONEY).pop()); saldoData = ultData; }
    else { const comSaldo = rows.filter(r => r._saldo != null && !isNaN(r._saldo)); if (comSaldo.length) { const u = comSaldo.reduce((m, r) => r.data >= m.data ? r : m); saldo = u._saldo; saldoData = u.data; } }
    rows.forEach(r => delete r._saldo);
    return { formato: 'PDF', banco: 'Mercado Pago', tipo: 'conta', rows, saldo, saldoData };
  }

  // --- Fatura de cartão com datas "05 OUT" (Nubank e outras)
  const venc = (T.match(/VENCIMENTO[^0-9]{0,40}(\d{2}[\/ ](?:\d{2}|[A-Z]{3})[\/ ]?\d{0,4})/) || [])[1];
  let vencISO = venc ? P.date(venc.replace(/ /g, '/'), refYear) : null;
  if (!vencISO && venc) { const mm = P.norm(venc).match(/(\d{2}) ([A-Z]{3}) ?(\d{4})?/); if (mm && MESES[mm[2]]) vencISO = P.iso(+(mm[3] || refYear), MESES[mm[2]], +mm[1]); }
  const yRef = vencISO ? +vencISO.slice(0, 4) : refYear;
  const mRef = vencISO ? +vencISO.slice(5, 7) : 12;
  const rows = [];
  const seen = {};
  let ultSaldo = null, primSaldo = null;
  for (const t of all) {
    const N = P.norm(t);
    let m, data = null, rest = '';
    if ((m = N.match(/^\s*(\d{2})\s+(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\b\s*(.*)$/))) {
      const mo = MESES[m[2]]; const y = mo > mRef ? yRef - 1 : yRef;
      data = P.iso(y, mo, +m[1]); rest = t.replace(/^\s*\d{2}\s+\S{3}\s*/, '');
    } else if ((m = t.match(/^\s*(\d{2}[\/\-]\d{2}(?:[\/\-]\d{2,4})?)\s+(.*)$/))) {
      data = P.date(m[1], yRef); rest = m[2];
      if (data && !/\d{4}$|\d{2}$/.test(m[1].slice(-4)) ) data = data;
      if (data && m[1].length <= 5) { const mo = +data.slice(5, 7); if (mo > mRef) data = P.iso(yRef - 1, mo, +data.slice(8, 10)); }
    }
    if (!data) continue;
    const vals = rest.match(MONEY);
    if (!vals) continue;
    const temSaldo = vals.length > 1 && /SALDO/.test(T);
    const vtxt = vals[temSaldo ? vals.length - 2 : vals.length - 1];
    if (temSaldo) ultSaldo = { data, v: P.money(vals[vals.length - 1]), ordem: rows.length };
    let valor = P.money(vtxt);
    let desc = rest.slice(0, rest.indexOf(vals[0])).replace(/•+\s*\d{4}/g, '').replace(/\s{2,}/g, ' ').trim();
    if (!desc || isNaN(valor)) continue;
    if (ultSaldo && ultSaldo.ordem === rows.length && !primSaldo) primSaldo = ultSaldo;
    const k = data + '|' + valor + '|' + P.norm(desc); seen[k] = (seen[k] || 0) + 1;
    rows.push({ data, valor, desc, fitid: 'p:' + k + '|' + seen[k], venc: vencISO || undefined });
  }
  let banco = /NU PAGAMENTOS|NUBANK/.test(T) ? 'Nubank' : /SHOPEE/.test(T) ? 'Shopee' : /RIACHUELO|MIDWAY/.test(T) ? 'Riachuelo' : /INTER/.test(T) ? 'Inter' : /SICREDI/.test(T) ? 'Sicredi' : /MERCADO PAGO/.test(T) ? 'Mercado Pago' : '';
  const fatura = /FATURA|CARTAO|LIMITE/.test(T);
  // em fatura, compra vem positiva: vira saída (negativa)
  if (fatura) for (const r of rows) r.valor = -r.valor;
  // saldo: "Saldo final/atual/disponível" no texto, ou a coluna de saldo da linha mais recente
  let saldo = null, saldoData = null;
  if (!fatura) {

// rules: [{k, cat, sub, tipo}]; pessoas: [{aliases:[...]}]
P.classify = function (row, conta, rules, pessoas) {
  const N = P.norm(row.desc);
  const nome = P.norm(P.clean(row.desc).nome);
  // reversão de Pix no crédito (Nubank)
  if (/:REVERSAL$/i.test(row.fitid || '')) return { tipo: 'neutro', cat: '', sub: '', auto: 'regra' };
  const ehCartao = conta && (conta.tipo === 'cartao' || conta.tipo === 'loja');
  // limite do cartão que virou dinheiro na conta (Pix no crédito para vocês, "Limite convertido em saldo"):
  // a parcela é dívida, não gasto; o gasto é o que se faz depois com o dinheiro
  if (ehCartao && row.valor < 0) {
    const praVoces = /PIX NO CREDITO/.test(N) && (pessoas || []).some(p => (p.aliases || []).some(a => P.norm(a) && nome.includes(P.norm(a))));
    if (praVoces || /LIMITE CONVERTIDO/.test(N)) return { tipo: 'pagdivida', cat: 'Limite do cartão', sub: '', auto: 'limite' };
  }
  let best = null;
  for (const r of rules) {
    const k = P.norm(r.k);
    if (!k || (r.sinal && Math.sign(row.valor) !== r.sinal)) continue;
    // regras prontas de gasto não valem para dinheiro que entra na conta (ex.: salário da "Loja Variedades")
    if (!r.user && r.tipo === 'despesa' && row.valor > 0 && !ehCartao) continue;
    if ((r.exato ? nome === k : (N.includes(k) || nome.includes(k))) && (!best || k.length > P.norm(best.k).length || r.user && !best.user)) best = r;
  }
  if (best && (best.user || best.tipo !== 'despesa')) return { tipo: best.tipo, cat: best.cat, sub: best.sub, auto: 'regra', espelho: best.espelho };
  // MEI (outro negócio): o que vem dele é dinheiro da família, o que vai para ele é transferência
  for (const k of (P.meiChaves || [])) { const K = P.norm(k); if (K && N.includes(K)) return row.valor > 0 ? { tipo: 'receita', cat: 'Retirada do MEI', sub: '', auto: 'mei' } : { tipo: 'transf', cat: '', sub: '', auto: 'mei' }; }
  // transferência entre o casal
  for (const p of pessoas || []) for (const a of p.aliases || []) {
    const A = P.norm(a);
    if (A && (nome.startsWith(A) || nome.includes(A))) return { tipo: 'transf', cat: '', sub: '', auto: 'casal' };
  }
  if (best) return { tipo: best.tipo, cat: best.cat, sub: best.sub, auto: 'regra', espelho: best.espelho };
  if (conta && (conta.tipo === 'cartao' || conta.tipo === 'loja')) return { tipo: row.valor > 0 ? 'neutro' : 'despesa', cat: '', sub: '', auto: '' };
  return { tipo: row.valor >= 0 ? 'receita' : 'despesa', cat: '', sub: '', auto: '' };
};

// Pix devolvido: a devolução e o Pix original não contam como entrada nem gasto
P.isDevol = desc => /DEVOLU|PIX DEVOLVIDO|ESTORNO DE PIX|ESTORNO PIX|PIX ESTORNADO|^ESTORNO\b/.test(P.norm(desc));
// procura o lançamento original (valor oposto, até 30 dias antes) para uma devolução
P.achaOriginal = (dev, cands) => cands.find(o => o !== dev && !o._par && Math.abs(o.valor + dev.valor) < 0.005 && o.data <= dev.data && o.data >= P.addDays(dev.data, -30) && !P.isDevol(o.desc));

if (typeof module !== 'undefined') module.exports = P;

function recorrentes() {

  const desde = mkey(addMeses(ult, -5)), g = new Map();

    const k = P.norm(t.nome || t.desc).replace(/\d+\/\d+$/, '').trim(); if (k.length < 3) continue;

const MAX_BUSCA = 300;
const textoBusca = new WeakMap(); // texto de busca já pronto de cada lançamento
function pintaLista() {
  const q = P.norm(V.busca);
  const todosMeses = !!q; // com busca, procura em todos os meses
  const comp = V.fCat || V.fRec || V.fSt; // filtros do Resumo: o mês é o da fatura, como nos totais
  let L = live().filter(t => (todosMeses || (comp ? mesDe(t) : mkey(t.data)) === V.mes) && filtraQuem(t));
  if (V.fConta) L = L.filter(t => t.conta === V.fConta);
  if (V.fCat) L = L.filter(t => { const g = gasto(t); return g && (V.fCat === '(sem)' ? !g.cat : g.cat === V.fCat) && (!V.fSub || (V.fSub === '(sem)' ? !g.sub : g.sub === V.fSub)); });
  if (V.fRec) L = L.filter(t => ehReceita(t) && (t.cat || '') === (V.fRec === '(sem)' ? '' : V.fRec));
  const abertoCart = t => ehCart(conta(t.conta)) && !t.pagoEm && (t.aberto || (t.venc && t.venc >= today()));
  if (V.fSt === 'apagar') L = L.filter(t => gasto(t) && abertoCart(t));
  if (V.fSt === 'pagos') L = L.filter(t => gasto(t) && !abertoCart(t));
  if (V.fSt === 'recebidos') L = L.filter(ehReceita);
  if (V.fSt === 'areceber') L = [];
  const pend = !todosMeses && (V.fSt === 'apagar' || V.fSt === 'areceber') ? (V.fSt === 'apagar' ? pendentes(V.mes).pagar : pendentes(V.mes).receber).filter(x => !V.fConta) : [];
  if (V.revisar) L = L.filter(t => t.tipo === 'despesa' && !t.cat);
  const bt = document.querySelector('#bt-porNome'); if (bt) bt.style.display = V.revisar ? '' : 'none';
  if (q) {
    const termos = q.split(' ');
    L = L.filter(t => { let e = textoBusca.get(t); if (!e || e.u !== t.upd) { e = { u: t.upd, s: P.norm([t.nome, t.desc, t.cat, t.sub, brl(t.valor), (conta(t.conta) || {}).nome].join(' ')) }; textoBusca.set(t, e); } return termos.every(w => e.s.includes(w)); });
  }
  L.sort((a, b) => b.data.localeCompare(a.data) || (b.criado || 0) - (a.criado || 0));
  const total = L.length; if (total > MAX_BUSCA) L = L.slice(0, MAX_BUSCA);
  const tot = L.reduce((a, t) => a + (t.tipo === 'despesa' || t.tipo === 'receita' ? t.valor : 0), 0);

  const rows = [], seen = {};
  const nomeDe = s => { const N = P.norm(s); return /METEOR|MERCAD|VENTAN|VENTA\b|MENTA|SUPERM|ERMERC/.test(N) ? 'METEORO SUPERMERCADOS VENTANIA' : /RECARGA|CELU|\bTIM\b/.test(N) ? 'RECARGA DE CELULAR TIM' : /BONUS|SORTE|PREMIO/.test(N) ? 'BONUS DA SORTE - PREMIOS' : ''; };
  for (let i = 0; i < L.length; i++) {
    const ds = [...L[i].matchAll(/(\d{2})\/(\d{2})\/(20\d{2})/g)].map(m => P.date(m[0])).filter(Boolean); if (!ds.length) continue;
    const mm = L[i].match(/R\s?[\$S5]\s*\d[\d.]*(?:[,:]\s?\d{2})?/); if (!mm) continue;
    let mv = P.moneyOCR(mm[0]); if (!mv) continue; const v = mv.certo ? Math.abs(mv.v) : +mv.raw / 100; if (!v) continue;
    const venc = ds[0], pago = ds[1];
    const nome = nomeDe(L[i].slice(0, L[i].search(/\d{2}\/\d{2}\/20\d{2}/))) || nomeDe(L[i - 1] || '') || 'Compra BônusCred';
    const k = venc + '|' + Math.round(v * 100); seen[k] = (seen[k] || 0) + 1;
    rows.push({ data: P.addDays(venc, -30), venc, valor: -v, desc: nome, pagoEm: pago || undefined, fitid: 'bcp:' + k + '|' + seen[k] });
  }

};
P.diffDias = (a, b) => Math.round((Date.parse(a + 'T12:00:00Z') - Date.parse(b + 'T12:00:00Z')) / 864e5);
P.parsePrint = function (texto, refYear, nomeArq) {
  const LL = texto.split(/\n/).map(s => s.replace(/[|]/g, ' ').trim()).filter(Boolean);
  const TT = P.norm(texto + ' ' + (nomeArq || ''));
  if (/EXTRATO SALDO CAJU|CAIU ?SALDO/.test(TT)) return P.parsePrintCaju(LL, refYear);
  if (/DETALHES DA FATURA/.test(TT) && /TRANSA|PARCELADO|\[\d\/\d\]/.test(TT) || /SHOPEE/.test(TT) && /PARCELADO/.test(TT)) return P.parsePrintShopee(LL, refYear);
  if (/BONUS ?CRED|EXTRATO DE COMPRAS|PAGO EM/.test(TT) && /VENCIMENTO/.test(TT)) return P.parsePrintBonus(LL);
  const linhas = texto.split(/\n/).map(s => s.replace(/[|]/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const T = P.norm(texto + ' ' + (nomeArq || ''));
  const MONEY = /-?\s*R\$\s*-?\s*\d{1,3}(?:\.\d{3})*,\d{2}|-?\d{1,3}(?:\.\d{3})*,\d{2}/g;
  const venc = (T.match(/VENC[A-Z]*[^0-9]{0,15}(\d{2}\/\d{2}(?:\/\d{2,4})?)/) || [])[1];
  const vencISO = venc ? P.date(venc, refYear) : null;
  const rows = [], seen = {}; let ultData = null;
  for (let i = 0; i < linhas.length; i++) {
    const l = linhas[i], N = P.norm(l);
    let m = l.match(/(\d{2}\/\d{2}(?:\/\d{2,4})?)/), data = m ? P.date(m[1], refYear) : null;
    if (!data && (m = N.match(/\b(\d{1,2})\s*(?:DE\s*)?(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)[A-Z]*\b/))) data = P.date(m[1] + ' ' + m[2], refYear);
    if (data) ultData = data;
    const vals = l.match(MONEY); if (!vals) continue;
    if (/TOTAL|SALDO|LIMITE|FATURA ATUAL|PAGAMENTO MINIMO|DISPONIVEL/.test(N)) continue;
    let desc = l.replace(MONEY, '').replace(/(\d{2}\/\d{2}(?:\/\d{2,4})?)/, '').replace(/\b\d{1,2}\s*(de\s*)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\b/i, '').replace(/\s{2,}/g, ' ').trim();
    if (desc.length < 3 && i > 0) desc = linhas[i - 1].replace(MONEY, '').trim();
    const d = data || ultData; if (!d || desc.length < 2) continue;
    const valor = -Math.abs(P.money(vals[vals.length - 1])); if (isNaN(valor) || !valor) continue;
    const k = d + '|' + valor + '|' + P.norm(desc); seen[k] = (seen[k] || 0) + 1;
    rows.push({ data: d, valor, desc, fitid: 'img:' + k + '|' + seen[k], venc: vencISO || undefined });
  }
  return { formato: 'Imagem', banco: /SHOPEE/.test(T) ? 'Shopee' : '', tipo: 'loja', venc: vencISO, rows, generico: true };
};

function proximasFaturas(nMeses = 6) {

  const add = (m, c, v) => { const r = R[m]; if (!r) return; r.total += v; r.porCartao[c.id] = (r.porCartao[c.id] || 0) + v; };
  const ult = new Map();

    const c = conta(t.conta); if (!ehCart(c) || !naFatura(t) || (V.quem !== 'all' && c.dono !== V.quem)) continue;

}

    <div class="tiny" style="margin-top:4px">Com o total, o app calcula sozinho a última parcela para fechar a conta.</div>
    <div class="tiny" style="font-weight:700;margin:16px 0 0;text-transform:uppercase;letter-spacing:.05em">Entrada</div>
    <div class="grid2"><div><label class="l">Valor (R$)</label><input class="f" id="ct-ev" inputmode="decimal" value="${n2(b.entrada && b.entrada.valor)}" placeholder="sem entrada"></div><div><label class="l">Data</label><input class="f" id="ct-ed" type="date" value="${(b.entrada && b.entrada.data) || ''}"></div></div>
    <label class="row small" style="gap:8px;margin-top:8px"><input type="checkbox" class="chk" id="ct-ep" ${!b.entrada || b.entrada.pago ? 'checked' : ''}> Entrada já paga</label>
    <div class="tiny" style="font-weight:700;margin:16px 0 0;text-transform:uppercase;letter-spacing:.05em">Parcelas</div>
    <div class="grid2"><div><label class="l">Quantidade</label><input class="f" id="ct-qtd" inputmode="numeric" value="${ini.qtd}"></div><div><label class="l">Valor de cada (R$)</label><input class="f" id="ct-pv" inputmode="decimal" value="${n2(ini.valor)}"></div></div>
    <label class="l">1º vencimento</label><input class="f" id="ct-pd" type="date" value="${ini.venc || ''}">
    <label class="row small" style="gap:8px;margin-top:10px"><input type="checkbox" class="chk" id="ct-var" ${b.variavel ? 'checked' : ''}> O valor da parcela pode mudar (reajuste)</label>
    <div class="tiny" style="margin-top:2px">Quando o pagamento aparecer no extrato, o app usa o valor pago de verdade e passa ele para as próximas parcelas.</div>
    <label class="l">Parcelas já pagas</label><input class="f" id="ct-pag" inputmode="numeric" value="${ini.pagas}">
    <div class="tiny" id="ct-resumo" style="margin-top:8px"></div>
  </div>
  <label class="l">Como o pagamento aparece no extrato (opcional)</label><input class="f" id="ct-ch" value="${esc((b.chaves || []).join(', '))}" placeholder="ex.: COHAPAR, nome de quem recebe o Pix">
  <div class="tiny" style="margin-top:4px">Com isso, o app marca as parcelas como pagas sozinho quando encontra o pagamento no extrato.</div>
  ${!novo && P0 ? `<details style="margin-top:14px"><summary class="small" style="cursor:pointer;font-weight:600">Ver parcelas (toque para marcar como paga ou não)</summary><div class="card" style="padding:4px 14px;margin:8px 0 0;max-height:40vh;overflow:auto">${b.entrada ? `<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>Entrada${b.entrada.data ? ' · ' + dshort(b.entrada.data) + '/' + b.entrada.data.slice(2, 4) : ''}</span><span>${esc(brl(b.entrada.valor))} <span class="tag ${b.entrada.pago ? 'acc' : 'amb'}" style="margin-left:6px">${b.entrada.pago ? 'paga' : 'a pagar'}</span></span></div>` : ''}${b.parcelas.map((x, i) => `<div class="row between" data-ptog="${i}" style="padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer"><span>${x.n}ª · ${dshort(x.venc)}/${x.venc.slice(2, 4)}</span><span>${esc(brl(x.valor))} <span class="tag ${x.pago ? 'acc' : x.venc < today() ? 'red' : 'amb'}" style="margin-left:6px">${x.pago ? 'paga' + (x.pagoEm ? ' ' + dshort(x.pagoEm) : '') : x.venc < today() ? 'atrasada' : 'a pagar'}</span></span></div>`).join('')}</div></details>` : ''}
  ${!novo && P0 ? `<button class="btn full" id="ct-reaj" style="margin-top:14px">${ti('percentage', 16)} Mudar o valor da parcela a partir de uma data</button>` : ''}
  <div class="grid2" style="margin-top:18px">${novo ? '<button class="btn" data-fechar>Cancelar</button>' : '<button class="btn danger" id="ct-del">Excluir</button>'}<button class="btn pri" id="ct-ok">Salvar</button></div>`);
  const q = id => s.querySelector(id), num = id => { const v = P.money(q(id).value); return isNaN(v) ? 0 : Math.abs(v); }, int = id => Math.max(0, parseInt(q(id).value) || 0);
  // monta a lista de parcelas a partir do formulário (mantém o "pago" das que já existiam)
  const monta = () => {
    const qtd = int('#ct-qtd'), pv = num('#ct-pv'), d0 = q('#ct-pd').value, tot = num('#ct-total'), ev = num('#ct-ev');
    if (!qtd || !pv || !d0) return null;
    const L = []; for (let k = 0; k < qtd; k++) L.push({ n: k + 1, venc: addMeses(d0, k), valor: P0 && P0[k] && !P0[k].final && (P0[k].reaj || (b.variavel && P0[k].pago)) ? P0[k].valor : pv });
    // última parcela calculada para fechar o total
    monta.aviso = '';
    if (tot) { const dif = Math.round((tot - ev - L.reduce((a, x) => a + x.valor, 0)) * 100) / 100;
      if (dif > 0.009 && dif < pv - 0.009) L.push({ n: qtd + 1, venc: addMeses(d0, qtd), valor: dif, final: true });
      else if (dif < -0.009 && -dif < pv - 0.009) { const u = L[L.length - 1]; u.valor = Math.round((u.valor + dif) * 100) / 100; u.final = true; }
      else if (Math.abs(dif) > 0.009) monta.aviso = dif > 0 ? `Faltam ${brl(dif)} para chegar no total: confira a quantidade ou o valor das parcelas.` : `As parcelas passam do total em ${brl(-dif)}: confira.`; }
    const pag = Math.min(L.length, int('#ct-pag'));
    const mesmo = P0 && int('#ct-pag') === ini.pagas;
    L.forEach((x, k) => { const old = P0 && P0[k]; x.pago = mesmo ? !!(old && old.pago) : k < pag; if (x.pago) x.pagoEm = (old && old.pago && old.pagoEm) || x.venc; if (old && old.manual) x.manual = true; });
    return L;
  };
  const resumo = () => { if (doPdf) return; const L = monta(), ev = num('#ct-ev'), tot = num('#ct-total'), el = q('#ct-resumo');
    if (!L) { el.textContent = 'Preencha quantidade, valor e 1º vencimento das parcelas.'; return; }
    const soma = ev + L.reduce((a, x) => a + x.valor, 0), ult = L[L.length - 1];
    el.innerHTML = `${L.length} parcela(s), a última em ${dshort(ult.venc)}/${ult.venc.slice(0, 4)}${ult.final ? ` de <b>${esc(brl(ult.valor))}</b>, para fechar o total` : ''}. Soma com a entrada: <b>${esc(brl(soma))}</b>${tot && Math.abs(tot - soma) < 0.01 ? ' <span style="color:var(--grn)">· confere com o total</span>' : ''}.${monta.aviso ? ` <span style="color:var(--amb)">${esc(monta.aviso)}</span>` : ''}`; };
  s.querySelectorAll('input').forEach(x => x.addEventListener('input', resumo));
  resumo();
  if (q('#ct-reaj')) q('#ct-reaj').onclick = () => {
    const r = sheet(`<h2>Mudar o valor da parcela</h2><p class="small muted" style="margin-top:-4px">Vale para as parcelas ainda não pagas que vencem a partir da data.</p>
      <div class="grid2"><div><label class="l">A partir de</label><input class="f" id="rj-d" type="date" value="${(b.parcelas.find(x => !x.pago) || {}).venc || today()}"></div><div><label class="l">Novo valor (R$)</label><input class="f" id="rj-v" inputmode="decimal"></div></div>
      <div class="grid2" style="margin-top:14px"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="rj-ok">Aplicar</button></div>`);
    r.querySelector('#rj-ok').onclick = () => { const d = r.querySelector('#rj-d').value, v = Math.abs(P.money(r.querySelector('#rj-v').value)); if (!d || !v) { toast('Preencha a data e o valor'); return; }
      let n = 0; for (const x of b.parcelas) if (!x.pago && x.venc >= d && !x.final) { x.valor = v; x.reaj = true; n++; }
      ajustaContrato(b); b.upd = Date.now(); save(); r.remove(); s.remove(); render(); toast(n + ' parcela(s) com o valor novo'); };
  };
  s.querySelectorAll('[data-ptog]').forEach(r => r.onclick = () => { const x = b.parcelas[+r.dataset.ptog]; x.pago = !x.pago; x.pagoEm = x.pago ? (x.pagoEm || today()) : undefined; x.manual = true; ajustaContrato(b); b.upd = Date.now(); save(); s.remove(); render(); editarContrato(b); });
  if (!novo) q('#ct-del').onclick = () => confirma('Excluir esta dívida?', () => { S.contratos = S.contratos.filter(x => x !== c); marcaApagado('contratos', c.id); save(); s.remove(); render(); }, 'Excluir');
  q('#ct-ok').onclick = () => {
    const tipo = q('#ct-tipo').value, nome = q('#ct-nome').value.trim() || TIPOS_CONTRATO[tipo];
    Object.assign(b, { tipo, nome, dono: q('#ct-dono').value, chaves: q('#ct-ch').value.split(',').map(x => x.trim()).filter(Boolean), upd: Date.now() });
    if (!doPdf) {
      const L = monta(); if (!L) { toast('Preencha quantidade, valor e 1º vencimento das parcelas'); return; }
      const ev = num('#ct-ev');
      b.entrada = ev ? { valor: ev, data: q('#ct-ed').value || '', pago: q('#ct-ep').checked, pagoEm: q('#ct-ep').checked ? (b.entrada && b.entrada.pagoEm) || q('#ct-ed').value || undefined : undefined } : undefined;
      b.valorTotal = num('#ct-total') || undefined; b.parcelas = L; b.manual = true; b.variavel = q('#ct-var').checked || undefined;
      ajustaContrato(b);
    }
    if (novo) S.contratos.push(b);
    baixaContratos(); save(); s.remove(); render(); toast('Dívida salva');
  };
}

function listaContas(L) {
  const G = [['conta', 'Contas'], ['cartao', 'Cartões de crédito'], ['loja', 'Crédito em lojas e apps'], ['beneficio', 'Benefícios'], ['invest', 'Investimentos']];
  return G.map(([tp, nm]) => { const X = L.filter(c => c.tipo === tp && !(tp === 'invest' && c.daConta && conta(c.daConta))); if (!X.length) return '';
    return `<div class="tiny" style="font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 0">${nm}</div><div class="list">${X.map(c => itemConta(c) + (tp === 'conta' ? cofrinhosDe(c).map(x => itemConta(x, true)).join('') : '')).join('')}</div>`; }).join('');
}
function itemConta(c, dentro) {
  const pp = c.pagaPor && conta(c.pagaPor);
  const sub = dentro ? (c.capital || /^COTAS CAPITAL/.test(P.norm(c.nome)) ? 'Cotas capital' : 'Cofrinho') : (TIPOS_CONTA[c.tipo] || '') + (pp ? ' · paga pela conta ' + pp.nome : '') + (c.tipo === 'cartao' && !c.fech ? ' · configurar fechamento' : '');
  if (dentro) { const s = saldoConta(c); return `<div class="it" data-editconta="${c.id}" style="padding-left:22px"><div class="ic" style="width:32px;height:32px;background:var(--accbg);color:var(--acc)">${ti(c.capital || /^COTAS CAPITAL/.test(P.norm(c.nome)) ? 'coins' : 'pig', 18)}</div><div class="mid"><div class="t">${esc(c.nome)}</div><div class="s">${esc(sub)}</div></div>${s != null ? `<div class="val small">${esc(brl(s))}</div>` : ''}</div>`; }
  const s = ['conta', 'invest', 'beneficio'].includes(c.tipo) ? saldoConta(c) : null;
  return `<div class="it" data-editconta="${c.id}">${logoBanco(c)}<div class="mid"><div class="t">${esc(c.nome)}</div><div class="s">${esc(sub)}</div></div>${s != null ? `<div class="val small ${s < 0 ? 'neg' : ''}">${esc(brl(s))}</div>` : `<span style="color:var(--tx3)">${ic('right', 'width="18" height="18"')}</span>`}</div>`;
}

  const tx = sh('Lançamentos').filter(r => r.id).map(r => cheio(r, { id: str(r.id), conta: str(r.conta_id), data: str(r.Data).slice(0, 10), nome: str(r['Descrição']), desc: str(r['No extrato']) || str(r['Descrição']), valor: +r.Valor || 0, tipo: str(r.tipo_id) || 'despesa', cat: str(r.Categoria), sub: str(r.Subcategoria), venc: str(r.Vencimento) || undefined, meio: str(r.meio), criado: +r.criado || 0, upd: +r.upd || 0, del: +r.excluido === 1 || undefined, travado: +r.travado === 1 || undefined, parc: str(r.parc) || undefined, contrato: str(r.contrato) || undefined, pagoEm: str(r.pagoEm) || undefined, aberto: +r.aberto === 1 || undefined }));
  const contas = sh('Contas').filter(r => r.id).map(r => cheio(r, { id: str(r.id), nome: str(r.Nome), dono: str(r.De), tipo: str(r.Tipo), banco: str(r.Banco), fech: +r.Fechamento || null, venc: +r.Vencimento || null, prazo: +r.PrazoDias || null, saldoIni: +r.SaldoInicial || 0, saldoRef: r.SaldoRefData !== '' && r.SaldoRefData != null && r.SaldoRef !== '' ? { valor: +r.SaldoRef || 0, data: str(r.SaldoRefData).slice(0, 10) } : undefined, chaves: str(r.chaves).split(' | ').filter(Boolean), icone: str(r.icone) || undefined, pagaPor: str(r.pagaPor) || undefined, pagChaves: r.pagChaves != null ? str(r.pagChaves).split(' | ').filter(Boolean) : undefined, daConta: str(r.daConta) || undefined, upd: +r.upd || 0 }));
  const json = v => { try { return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; } };
  const contratos = sh('Dívidas').filter(r => r.id).map(r => cheio(r, { id: str(r.id), nome: str(r.Nome), dono: str(r.De), tipo: str(r.Tipo), parcela: +r.Parcela || 0, total: +r.Total || 0, pagas: +r.Pagas || 0, dia: +r.Dia || 1,
    banco: str(r.Banco) || undefined, numero: str(r.Numero) || undefined, liberado: +r.Liberado || undefined, totalPagar: +r.TotalPagar || undefined, juros: +r.Juros || undefined, contratado: str(r.Contratado) || undefined, parcelas: json(str(r.parcelas)), upd: +r.upd || 0 }));
  const fixas = sh('Fixas').filter(r => r.id).map(r => cheio(r, { id: str(r.id), nome: str(r.Nome), tipo: str(r.Tipo) || 'despesa', valor: +r.Valor || 0, dia: +r.Dia || 1, cat: str(r.Categoria), sub: str(r.Subcategoria), dono: str(r.De), chave: str(r.Texto), upd: +r.upd || 0 }));
  const cats = { despesa: [], receita: [], entdivida: [] }, orc = {}, orcUpd = {};
  for (const r of sh('Categorias')) { if (!cats[r.tipo]) continue; cats[r.tipo].push({ nome: str(r.Nome), e: '', cor: str(r.Cor), subs: str(r.Subcategorias).split(' | ').filter(Boolean), i: str(r.icone) || ICON_CAT[str(r.Nome)] || 'tag', si: (() => { try { return JSON.parse(str(r.icones_sub) || '{}'); } catch (e) { return {}; } })() }); if (+r['Orçamento']) orc[str(r.Nome)] = +r['Orçamento']; if (+r.orc_upd) orcUpd[str(r.Nome)] = +r.orc_upd; }
  const regras = sh('Regras').filter(r => r.Texto).map(r => ({ k: str(r.Texto), tipo: str(r.Tipo), cat: str(r.Categoria), sub: str(r.Subcategoria), user: true, upd: +r.upd || 0 }));
  const pessoas = sh('Pessoas').filter(r => r.id).map(r => cheio(r, { id: str(r.id), nome: str(r.Nome), aliases: str(r.Nomes_no_extrato).split(' | ').filter(Boolean) }));
  const info = sh('Info')[0] || {};
  return { tx, contas, contratos, fixas, cats, orc, orcUpd, regras, pessoas, de: str(info.salvo_por), mei: str(info.mei).split(' | ').filter(Boolean), apagados: json(str(info.apagados)) || {} };
}
$('#bkIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const B = await lerBackup(f);
    if (V.bkModo === 'abrir') {
      confirma(`Substituir tudo deste celular pelo backup (${B.tx.filter(t => !t.del).length} lançamentos)?`, () => {
        const eu = S.eu; const base = seed();
        S = Object.assign(base, { tx: B.tx, contas: B.contas.length ? B.contas : base.contas, contratos: B.contratos, fixas: B.fixas, meiChaves: B.mei, apagados: B.apagados, orc: B.orc, orcUpd: B.orcUpd, pessoas: B.pessoas.length ? B.pessoas : base.pessoas, eu, ultimoBackup: Date.now(), mud: 0 });
        if (B.cats.despesa.length) S.cats = B.cats;
        S.regras = base.regras.concat(B.regras);
        S.mig = 1; migra(); P.meiChaves = S.meiChaves || [];
        save(false); render(); toast('Backup aberto');
      }, 'Substituir');
    } else {
      // juntar: o mais recente vence; nada é apagado sem marca de exclusão
      let novos = 0, atual = 0;
      const mapa = new Map(S.tx.map(t => [t.id, t]));
      for (const t of B.tx) { const a = mapa.get(t.id); if (!a) { S.tx.push(t); if (!t.del) novos++; } else if ((t.upd || 0) > (a.upd || 0)) { Object.assign(a, t); atual++; } }
      for (const c of B.contas) { const a = conta(c.id); if (!a) S.contas.push(c); else { if ((c.upd || 0) > (a.upd || 0)) Object.assign(a, c, { chaves: [...new Set([...(a.chaves || []), ...c.chaves])] }); else a.chaves = [...new Set([...(a.chaves || []), ...c.chaves])]; } }
      const ap = Object.assign({}, B.apagados || {}); for (const k in S.apagados || {}) ap[k] = Object.assign({}, ap[k] || {}, S.apagados[k]); S.apagados = ap;
      const vivo = (lista, x) => !((ap[lista] || {})[x.id] >= (x.upd || 0));
      for (const c of B.contratos) { if (!vivo('contratos', c)) continue; const a = S.contratos.find(x => x.id === c.id); if (!a) S.contratos.push(c); else if ((c.upd || 0) > (a.upd || 0)) Object.assign(a, c); }
      S.fixas = S.fixas || []; for (const f of B.fixas) { if (!vivo('fixas', f)) continue; const a = S.fixas.find(x => x.id === f.id); if (!a) S.fixas.push(f); else if ((f.upd || 0) > (a.upd || 0)) Object.assign(a, f); }
      S.contratos = S.contratos.filter(x => vivo('contratos', x)); S.fixas = S.fixas.filter(x => vivo('fixas', x));
      if (!(S.meiChaves || []).length && B.mei.length) { S.meiChaves = B.mei; P.meiChaves = B.mei; }
      for (const r of B.regras) { const a = S.regras.find(x => x.user && P.norm(x.k) === P.norm(r.k)); if (!a) S.regras.push(r); else if ((r.upd || 0) > (a.upd || 0)) Object.assign(a, r); }
      for (const tp of ['despesa', 'receita', 'entdivida']) for (const c of B.cats[tp]) { const a = S.cats[tp].find(x => x.nome === c.nome); if (!a) S.cats[tp].push(c); else a.subs = [...new Set([...a.subs, ...c.subs])]; }
      // orçamentos: vale o alterado por último (backups antigos, sem data, só preenchem o que falta)
      S.orcUpd = S.orcUpd || {};
      for (const k in B.orcUpd) if (B.orcUpd[k] > (S.orcUpd[k] || 0)) { if (B.orc[k] > 0) S.orc[k] = B.orc[k]; else delete S.orc[k]; S.orcUpd[k] = B.orcUpd[k]; }
      for (const k in B.orc) if (!B.orcUpd[k] && !S.orc[k]) S.orc[k] = B.orc[k];
      save(); render();
      sheet(`<div style="text-align:center"><div style="color:var(--acc2);display:flex;justify-content:center">${ti('circle-check', 44)}</div><h2>Backup juntado</h2><p class="muted">${novos} lançamento(s) novo(s) de ${esc(donoNome(B.de) || 'outro celular')}${atual ? ` e ${atual} atualizado(s)` : ''}.</p><button class="btn pri full" data-fechar>Ok</button></div>`);
    }
  } catch (err) { toast(err.message || 'Não consegui abrir o backup'); }
};

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
